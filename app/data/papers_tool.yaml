- short_name: FailureMem
  title: 'FailureMem: A Failure-Aware Multimodal Framework for Autonomous Software
    Repair'
  authors: Ruize Ma, Yilei Jiang, Shilin Zhang, Zheng Ma, Yi Feng, Vincent Ng, Zhi
    Wang, Xiangyu Yue, Chuanyi Li, Lewei Lu
  year: '2026'
  venue: arXiv preprint arXiv:2603.17826
  month: 2026-03
  abstract: 'Multimodal Automated Program Repair (MAPR) extends traditional program
    repair by requiring models to jointly reason over source code, textual issue descriptions,
    and visual artifacts such as GUI screenshots. While recent LLM-based repair systems
    have shown promising results, existing approaches face several limitations: rigid
    workflow pipelines restrict exploration during debugging, visual reasoning is
    often performed over full-page screenshots without localized grounding, and failed
    repair attempts are rarely transformed into reusable knowledge. To address these
    challenges, we propose FailureMem, a multimodal repair framework that integrates
    three key mechanisms: a hybrid workflow-agent architecture that balances structured
    localization with flexible reasoning, active perception tools that enable region-level
    visual grounding, and a Failure Memory Bank that converts past repair attempts
    into reusable guidance. Experiments on SWE-bench Multimodal demonstrate FailureMem
    improves the resolved rate over GUIRepair by 3.7%.'
  links:
    arxiv: https://arxiv.org/abs/2603.17826
    github: https://github.com/Ruize-Ma/FailureMem
- short_name: A Study on the Impact of Fault localization Granularity for Repository-Scale
    Code Repair Tasks
  title: A Study on the Impact of Fault localization Granularity for Repository-Scale
    Code Repair Tasks
  authors: Joseph Townsend, Chandresh Pravin, Kwun Ho Ngan, Matthieu Parizy
  year: '2026'
  venue: arXiv preprint arXiv:2604.00167
  month: 2026-03
  abstract: Automatic program repair can be a challenging task, especially when resolving
    complex issues at a repository-level, which often involves issue reproduction,
    fault localization, code repair, testing and validation. Issues of this scale
    can be commonly found in popular GitHub repositories or datasets that are derived
    from them. Some repository-level approaches separate localization and repair into
    distinct phases. Where this is the case, the fault localization approaches vary
    in terms of the granularity of localization. Where the impact of granularity is
    explored to some degree for smaller datasets, not all isolate this issue from
    the separate question of localization accuracy by testing code repair under the
    assumption of perfect fault localization. To the best of the authors' knowledge,
    no repository-scale studies have explicitly investigated granularity under this
    assumption, nor conducted a systematic empirical comparison of granularity levels
    in isolation. We propose a framework for performing such tests by modifying the
    localization phase of the Agentless framework to retrieve ground-truth localization
    data and include this as context in the prompt fed to the repair phase. We show
    that under this configuration and as a generalization over the SWE-Bench-Mini
    dataset, function-level granularity yields the highest repair rate against line-level
    and file-level. However, a deeper dive suggests that the ideal granularity may
    in fact be task dependent. This study is not intended to improve on the state-of-the-art,
    nor do we intend for results to be compared against any complete agentic frameworks.
    Rather, we present a proof of concept for investigating how fault localization
    may impact automatic code repair in repository-scale scenarios. We present preliminary
    findings to this end and encourage further research into this relationship between
    the two phases.
  links:
    arxiv: https://arxiv.org/abs/2604.00167
- short_name: DAIRA
  title: Dynamic analysis enhances issue resolution
  authors: Mingwei Liu, Zihao Wang, Zhenxi Chen, Zheng Pei, Yanlin Wang, Zibin Zheng
  year: '2026'
  venue: arXiv preprint arXiv:2603.22048
  month: 2026-03
  abstract: Resolving complex code defects from natural language descriptions remains
    a fundamental software engineering challenge. Recently, large language models
    (LLMs) have driven the creation of agent-based automated repair systems. While
    improving repository-level problem-solving, current methods struggle with complex
    defects like intricate polymorphic control flows and implicit type degradation.
    These approaches rely on static analysis and shallow execution feedback, lacking
    the ability to monitor intermediate execution states. Consequently, agents often
    fall into speculative exploration, consuming significant tokens without identifying
    the root cause. We introduce DAIRA (Dynamic Analysis-enhanced Issue Resolution
    Agent), a pioneering automated repair framework deeply embedding dynamic analysis
    into the agent's decision loop. DAIRA employs a Test Tracing-Driven workflow,
    using lightweight tools to capture runtime evidence (e.g., call stacks and variable
    states) and convert it into structured semantic reports. By illuminating execution
    paths and causal dependencies, DAIRA enables precise fault localization and prevents
    context window flooding from irrelevant code retrievals. This shifts the agent's
    approach from speculative reasoning to deterministic inference. Evaluations on
    the SWE-bench Verified benchmark show DAIRA achieves a state-of-the-art 79.4%
    resolution rate when powered by Gemini 3 Flash Preview. Furthermore, it demonstrates
    robustness in addressing deep-seated logical defects, securing a 44.4% resolution
    rate on the most demanding tasks. Compared to baselines, DAIRA uniquely resolves
    complex edge cases and improves operational efficiency. Across various LLMs, it
    reduces inference costs by approximately 10% and input token consumption by 25%.
