- short_name: Empowering Autonomous Debugging Agents with Efficient Dynamic Analysis
  title: Empowering Autonomous Debugging Agents with Efficient Dynamic Analysis
  authors: Jiahong Xiang, Xiaoyang Xu, Xiaopan Chu, Hongliang Tian, Yuqun Zhang
  year: '2026'
  venue: arXiv preprint arXiv:2604.24212
  month: 2026-04
  abstract: Autonomous agents for automated program repair represent a promising frontier
    in software engineering, yet their effectiveness is often hindered by reliance
    on post-mortem, coarse-grained execution feedback. While integrating traditional
    interactive debuggers seems a natural solution, their low-level, line-by-line
    interaction paradigm turns out to be cost-inefficient for LLM-based agents, leading
    to exhausted budgets and unproductive loops. To mitigate this, we introduce Agent-centric
    Debugging Interface (ADI), a novel agent-centric debugging interface designed
    for cost-efficient, end-to-end autonomous interaction. Specifically, Agent-centric
    Debugging Interface realizes a function-level interaction paradigm, powered by
    our Frame Lifetime Trace, a comprehensive data structure encapsulating a function's
    stateful execution trace, and a set of high-level navigational commands. Our extensive
    evaluation on the SWE-bench benchmark demonstrates the effectiveness and efficiency
    of ADI. By simply equipping a basic agent with ADI, it successfully resolves 63.8\%
    of the tasks on the SWE-bench Verified set, even slightly outperforming the highly
    optimized and high-investment Claude-Tools agent, at an average cost of USD 1.28
    per task with Claude-Sonnet-3.7. Furthermore, we demonstrate ADI's generality
    by integrating it as a plug-and-play component into existing SOTA agents, delivering
    consistent gains ranging from 6.2\% to 18.5\% on the resolved tasks. These results
    indicate that Agent-centric Debugging Interface can provide a general and efficient
    enhancement for existing autonomous agents.
  links:
    arxiv: https://arxiv.org/abs/2604.24212
- short_name: DebugHarness
  title: 'DebugHarness: Emulating Human Dynamic Debugging for Autonomous Program Repair'
  authors: Maolin Sun, Yibiao Yang, Xuanlin Liu, Yuming Zhou, Baowen Xu
  year: '2026'
  venue: arXiv preprint arXiv:2604.03610
  month: 2026-04
  abstract: Patching severe security flaws in complex software remains a major challenge.
    While automated tools like fuzzers efficiently discover bugs, fixing deep-rooted
    low-level faults (e.g., use-after-free and memory corruption) still requires labor-intensive
    manual analysis by experts. Emerging Large Language Model (LLM) agents attempt
    to automate this pipeline, but they typically treat bug fixing as a purely static
    code-generation task. Relying solely on static artifacts, these methods miss the
    dynamic execution context strictly necessary for diagnosing intricate memory safety
    violations. To overcome these limitations, we introduce DebugHarness, an autonomous
    LLM-powered debugging agent harness that resolves complex vulnerabilities by emulating
    the interactive debugging practices of human systems engineers. Instead of merely
    examining static code, DebugHarness actively queries the live runtime environment.
    Driven by a reproducible crash, it utilizes a pattern-guided investigation strategy
    to formulate hypotheses, interactively probes program memory states and execution
    paths, and synthesizes patches via a closed-loop validation cycle. We evaluate
    DebugHarness on SEC-bench, a rigorous dataset of real-world C/C++ security vulnerabilities.
    DebugHarness successfully patches approximately 90% of the evaluated bugs. This
    yields a relative improvement of over 30% compared to state-of-the-art baselines,
    demonstrating that dynamic debugging significantly enhances LLM diagnostic capabilities.
    Overall, DebugHarness establishes a novel paradigm for automated program repair,
    bridging the gap between static LLM reasoning and the dynamic intricacies of low-level
    systems programming.
  links:
    arxiv: https://arxiv.org/abs/2604.03610
- short_name: PROBE
  title: 'Probe to Generate: Program Variant-Guided Test Augmentation for Repository-Level
    Repair Benchmarks'
  authors: Chenglin Li, Yisen Xu, Zehao Wang, Shin Hwei Tan, Tse-Hsun, Chen
  year: '2026'
  venue: arXiv preprint arXiv:2604.01518
  month: 2026-04
  abstract: Test-based benchmarks such as SWE-bench have become a standard basis for
    evaluating automated issue resolution agents, deeming a patch correct if it passes
    a provided regression test suite. In practice, weak test suites can admit plausible
    but semantically incorrect patches, inflating reported agent performance. We present
    \tool, a test augmentation framework that uses semantically modified program variants
    as behavioral probes to identify and close gaps in benchmark test suites. Variants
    of the reference patch that survive the original tests reveal under-constrained
    behaviors, which then guide targeted regression test generation. Each generated
    test is retained only if it passes on the reference patch, fails on at least one
    surviving variant, and remains robust under behavior-preserving transformations.
    On SWE-bench Verified, 77% of instances admit at least one surviving variant.
    \tool generates 1,014 validated tests across 211 instances, increasing patch-region
    line and branch coverage by 10.8 and 9.5 percentage points. Re-evaluating the
    top-10 repair agents with the augmented suites reduces resolved rates by 4.2%-9.0%,
    showing that many previously accepted patches exploit benchmark test gaps rather
    than fully satisfying the intended repair semantics. These findings demonstrate
    that benchmark evaluation is not solely a patch-generation problem but also a
    test-strength problem.
  links:
    arxiv: https://arxiv.org/abs/2604.01518
