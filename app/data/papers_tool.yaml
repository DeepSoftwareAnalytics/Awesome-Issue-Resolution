- short_name: MM-IssueLoc
  title: 'MM-IssueLoc: A Controlled Benchmark for Evaluating Visual Evidence in Multimodal
    Repository-Level Issue Localization'
  authors: Shaoxiong Zhan, Shi Hu, Boyu Feng, Hai Lin, Andrew Gong, Zhengda Zhou,
    Jiaying Zhou, Yunyun Hou, Hao Su, Hai-Tao Zheng
  year: '2026'
  venue: arXiv preprint arXiv:2607.15205
  month: 2026-07
  abstract: 'Real repository issues routinely include visual evidence such as screenshots,
    error dialogs, rendered UI states, and logs, yet repository-level issue localization
    is evaluated mostly as a text-only task. Existing multimodal SE benchmarks evaluate
    end-to-end repair, entangling localization with patch synthesis and obscuring
    whether visual input helped, hurt, or was ignored. We introduce \textbf{MM-IssueLoc},
    a controlled benchmark and evaluation protocol for repository-level localization
    with visual evidence. MM-IssueLoc contains 652 issue-PR instances across 23 languages,
    with annotations for 7 image categories and 4 relevance levels. It provides file-level
    and function-level gold labels, paired text-only and with-image evaluation, and
    VCE-based diagnostics that convert images into structured textual evidence. We
    evaluate LLM-based and retrieval-based systems, including MM-IssueLoc-VL-Emb as
    a controlled multimodal retriever. Results show that existing systems remain far
    from reliable multimodal repository localization: the strongest agent reaches
    38.96 file Acc@5 and 22.45 function Acc@10, while the strongest retriever reaches
    33.86 function Acc@10. Cross-benchmark comparisons show that high localization
    scores on text-dominant SWE benchmarks do not transfer cleanly to multimodal issue
    localization. MM-IssueLoc turns visual evidence into an explicit evaluation variable,
    enabling future work to test whether systems improve by using visual evidence
    for localization, rather than by relying on text-only cues or downstream patch-generation
    effects.'
  links:
    arxiv: https://arxiv.org/abs/2607.15205
    github: https://github.com/Jasaxion/MM-IssueLoc-Bench
- short_name: LLVM-Bench
  title: 'LLVM-Bench: Benchmarking and Advancing Large Language Models for LLVM Compiler
    Issue Resolution'
  authors: Zhao Tian, Yingquan Zhao, Chenyao Suo, Meng Wang, Junjie Chen
  year: '2026'
  venue: arXiv preprint arXiv:2607.00700
  month: 2026-07
  abstract: LLVM is a widely used compiler infrastructure whose scale and complexity
    make issue resolution labor-intensive and challenging. Although large language
    models (LLMs) have recently achieved remarkable success in issue resolution, their
    effectiveness on complex system-level LLVM compiler remains largely unexplored.
    To address this gap, we introduce LLVM-Bench, the first large-scale benchmark
    for LLVM issue resolution, containing 423 real-world, validated tasks collected
    from the LLVM project. We further develop LLVM-Gym, a scalable evaluation platform
    that automates issue reproduction, patch application, compiler building, and test
    execution. Using LLVM-Bench and LLVM-Gym, we conduct a comprehensive study of
    four representative LLMs, six retrieval configurations, and three agents. Our
    results show that current LLM-based issue resolution techniques remain limited
    on LLVM-Bench, with patch invalidity and build failures as the dominant failure
    modes. We further reveal a strong complementarity among different LLMs and agents,
    motivating LLVM-Ens, a lightweight ensemble approach that expands the patch space
    through integrating the patches generated by diverse techniques, filters incorrect
    and redundant candidates, and identifies the most promising solution. Our results
    show that LLVM-Ens achieves a resolution rate of up to 21.99%, further improving
    LLVM issue resolution.
  links:
    arxiv: https://arxiv.org/abs/2607.00700
- short_name: Know Before Fix
  title: 'Know Before Fix: QA-Driven Repository Knowledge Acquisition for Software
    Issue Resolution'
  authors: Haotian Lin, Silin Chen, Xiaodong Gu, Yuling Shi, Chengxi Pan, Jiaqi Ge,
    Mengfan Li, Jianghong Huang, Mengchieh Chuang, Beijun Shen, Haibing Guan
  year: '2026'
  venue: arXiv preprint arXiv:2607.11111
  month: 2026-07
  abstract: 'LLM-based coding agents have significantly advanced automated software
    issue resolution, yet they remain highly prone to factual errors caused by insufficient
    repository understanding. Recent methods attempt to mitigate this limitation through
    pre-repair repository exploration; however, their fix-driven strategies explore
    repositories without identifying the agent''s knowledge gaps, often yielding imprecise
    context that fails to bridge the underlying understanding deficit. In this paper,
    we propose ACQUIRE, a QA-driven framework for software issue resolution. Mirroring
    how experienced developers first comprehend unfamiliar code before attempting
    a fix, ACQUIRE explicitly acquires repository knowledge prior to repair. The framework
    decouples knowledge acquisition from patch generation through two stages: in the
    first stage, a Questioner and an Answerer collaborate to acquire structured repository
    knowledge, where the Questioner poses targeted questions and the Answerer produces
    evidence-grounded answers through autonomous exploration; in the second stage,
    the Resolver leverages the resulting QA knowledge to generate informed patches.
    By transforming implicit knowledge gaps into explicit, factually reliable understanding,
    ACQUIRE accelerates knowledge-intensive repair stages and enables more accurate
    resolution. Experiments on SWE-bench Verified demonstrate that ACQUIRE consistently
    outperforms representative pre-repair methods, raising Pass@1 by up to 4.4 percentage
    points with modest additional cost and time.'
  links:
    arxiv: https://arxiv.org/abs/2607.11111
- short_name: TrajSpec
  title: Bug Report Specification Refinement with Trajectory Guidance for Automated
    Program Repair
  authors: S M Farah Al Fahim, Md Nakhla Rafi, Md Ahasanuzzaman, Zeyang Ma, Dong Jae
    Kim, Shaowei Wang, Tse-Hsun, Chen
  year: '2026'
  venue: arXiv preprint arXiv:2607.07882
  month: 2026-07
  abstract: Bug reports serve as task specifications for repository-level automated
    program repair (APR) agents, but they often describe only the observed failure
    and omit repair-relevant information such as the failure-inducing behavior, behavioral
    requirement, and implementation scope. As a result, a repair agent may inspect
    irrelevant code, infer an incorrect requirement, or generate a patch that addresses
    the reported symptom without restoring the intended repository behavior. We present
    TrajSpec, a trajectory-guided approach for repository-supported bug report specification
    refinement. Given an original report and a pre-fix repository, TrajSpec runs a
    trajectory-collection agent and uses the resulting unverified trajectory as a
    source of trajectory-derived specification evidence. It organizes this evidence
    into a three-level representation consisting of a high-level interpretation of
    the issue, diagnostic findings supporting that interpretation, and concrete repository
    observations. TrajSpec then generates a draft refined report and applies repository-based
    review to remove unsupported claims, revise uncertain claims, and add repository-supported
    details. We evaluate TrajSpec on all 300 SWE-Bench Lite instances using Mini-SWE-Agent
    V2. TrajSpec's refined reports improve Pass@1 from 41.00% to 59.67% with GPT-5-mini
    and from 54.67% to 64.33% with MiniMax M2.5. On a stratified sample of 100 instances,
    TrajSpec's refined reports also improve Pass@1 from 41.00% to 71.00% with Agentless
    and from 47.00% to 72.00% with AutoCodeRover. Ablation results show that removing
    repository-based review or the hierarchical evidence representation reduces Pass@1
    from 59.67% to 48.00% and 47.67%, respectively. Overall, TrajSpec provides actionable
    repository-supported context that consistently improves repair performance.
  links:
    arxiv: https://arxiv.org/abs/2607.07882
- short_name: PhoenixRepair
  title: 'PhoenixRepair: Rethinking Repair Strategy Exploration in Software Agents'
  authors: Tianyue Jiang, Yanlin Wang, Xin He, Daya Guo, Jiachi Chen, Ming Wen, Ensheng
    Shi, Xilin Liu, Yuchi Ma, Guanbin Li
  year: '2026'
  venue: arXiv preprint arXiv:2607.18859
  month: 2026-07
  abstract: While Large Language Models have greatly advanced automated issue resolution,
    existing agent-based methods exhibit a fundamental limitation in their insufficient
    exploration of repair strategies. This insufficiency manifests in two key aspects.
    First, the exploration of multiple potential edit locations is limited. Second,
    the exploration of repair attempts at each location is also insufficient. To address
    these challenges, we present PhoenixRepair, a multi-agent framework that systematically
    explores multiple candidate edit locations and performs iterative reflection and
    refinement on patch generation, thereby expanding the search space of repair strategies.
    Our framework begins with multi-location sampling, optionally augmented with graph-based
    localization information for difficult tasks, followed by iterative reflection
    and refinement to generate better patches, culminating in final-round generation
    guided by distilled insights from all historical attempts. Experiments on SWE-bench-Verified
    demonstrate that PhoenixRepair achieves the largest relative improvement of 7.8\%
    over SWE-agent under DeepSeek-V3.1, and attains the highest resolved rate of 76.0\%
    Pass@1 under MiniMax-M2.5. Meanwhile, it achieves higher fault localization accuracy
    than existing approaches. Our code is available at https://github.com/DeepSoftwareAnalytics/PhoenixRepair.
  links:
    arxiv: https://arxiv.org/abs/2607.18859
    github: https://github.com/DeepSoftwareAnalytics/PhoenixRepair
- short_name: Beyond Fail-to-Pass
  title: 'Beyond Fail-to-Pass: Iterative Hardening of Co-Generated Bug Reproduction
    Tests and Fixes'
  authors: Yuhao Tan, Zhibang Yang, Fangkai Yang, Yuan Yao, Yu Kang, Lu Wang, Pu Zhao,
    Xin Zhang, Xiaoxing Ma, Qingwei Lin, Saravan Rajmohan, Dongmei Zhang
  year: '2026'
  venue: arXiv preprint arXiv:2607.19843
  month: 2026-07
  abstract: Large language models (LLMs) have made automated program repair (APR)
    increasingly practical for real-world bugs, but repairing directly from bug reports
    remains underconstrained. Bug reproduction tests (BRTs) help close this gap by
    turning a bug report into an executable, bug-specific signal that can guide repair
    and validate candidate patches. Existing work has therefore studied BRT generation
    as a core subproblem in APR and mainly evaluates a generated BRT using the fail-to-pass
    (F->P) criterion, which requires the test to fail on the buggy code but pass on
    the golden fix. We show that F->P alone is insufficient when the goal of a BRT
    is to improve downstream repair. In particular, some F->P BRTs are lax, reproducing
    the observed symptom yet still admitting plausible-but-incorrect patches. We formalize
    this missing quality dimension by separating F->P BRTs into rigorous and lax ones,
    and show empirically that only the former consistently improve repair success.
    We further find that co-generation introduces test--fix error coupling, where
    the in-trajectory fail-to-pass (F->P) check can pass even when both the generated
    patch and generated test are wrong. Based on these findings, we propose CoHarden,
    a co-generation framework that uses the Lax signal as an in-loop convergence criterion.
    CoHarden first generates a test before any fix, then iteratively hardens the test
    and fix against surviving mutation patches until the generated test no longer
    admits Lax regressions. Experiments show that CoHarden reaches 69.4% Resolved
    and 78.9% F->P on SWE-bench Verified, outperforming the strongest fix-only and
    cogeneration baselines by +9.6 and +7.9 percentage points in Resolved, respectively,
    with consistent gains across LLM backbones and benchmarks.
  links:
    arxiv: https://arxiv.org/abs/2607.19843
- short_name: IssueExec
  title: 'IssueExec: A Test-Driven Approach for Localizing Software Engineering Issues'
  authors: Jiawei Liu, Yun Lin, Chenyan Liu, Yu Qian, Yiming Liu, Jiaxin Chang, Weinan
    Zhang, Linpeng Huang
  year: '2026'
  venue: arXiv preprint arXiv:2607.17286
  month: 2026-07
  abstract: 'Issue localization, which identifies code locations requiring modification
    from issue descriptions, is a critical step in automated software maintenance.
    Existing approaches predominantly attempt to directly align issue descriptions
    with code elements, yet often struggle due to the inherent abstraction gap between
    the issue description and code implementation. Seeking alternative signals, our
    theoretical analysis suggests that test suites can serve as executable proxies
    for requirements, reducing localization uncertainty by 7.73 bits of entropy on
    average. A large-scale empirical study on 18 repositories validates this premise:
    existing tests cover 96.98\% of ground-truth files, and the two-hop pathway yields
    stronger semantic connectivity than direct matching in 82.4\% of cases. Despite
    their potential, leveraging tests for localization faces two key challenges: the
    semantic gap separating issue descriptions from test identifiers, and the substantial
    noise in execution traces from infrastructure code. To address these, we propose
    IssueExec, which bridges the semantic gap through domain-knowledge-enhanced test
    representations and filters noise via hierarchical trace analysis. Experiments
    on SWE-bench Lite show that IssueExec achieves state-of-the-art performance, improving
    function-level Recall@1 by 41.57\% over the strongest baseline. When integrated
    into the Agentless pipeline, IssueExec resolves 17.72\% more issues, demonstrating
    practical downstream benefits.'
  links:
    arxiv: https://arxiv.org/abs/2607.17286
- short_name: VisualRepair
  title: 'VisualRepair: Dynamic Tool Calling and Region Focusing for Visual Software
    Issue Repair'
  authors: Jingyu Xiao, Zhongyi Zhang, Haoran Hou, Yuxuan Wan, Yuan Jiang, Yintong
    Huo, Michael R. Lyu
  year: '2026'
  venue: arXiv preprint arXiv:2607.14075
  month: 2026-07
  abstract: 'Automated Program Repair (APR) has witnessed significant progress with
    the advent of Large Language Models (LLMs). However, as modern software systems
    increasingly expose rich graphical user interfaces, effectively leveraging visual
    information from bug screenshots has become essential for understanding bugs and
    generating accurate fixes in multimodal scenarios. Real-world issue reports frequently
    contain heterogeneous visual attachments including UI screenshots, IDE snapshots,
    GIFs, and text-centric images, each with distinct visual patterns and domain-specific
    semantics that impose substantial perceptual demands on MLLMs. Furthermore, bug
    screenshots often contain large expanses of uninformative and bug-irrelevant regions,
    distracting the model''s attention and limiting patch diversity. To address these
    challenges, we propose VisualRepair, an MLLM-based framework for visual software
    issue repair comprising two core modules: Image Type-aware Tool Calling (ITTC),
    which classifies input images and dynamically invokes a tailored tool-calling
    chain for robust visual interpretation, and Dynamic Test-time Region Focusing
    (DTRF), which grounds multiple bug-related region candidates and refines them
    via an adaptive zoom-in and zoom-out strategy to improve fault localization and
    promote diverse patch generation. Extensive experiments on the SWE-bench Multimodal
    benchmark demonstrate that VisualRepair consistently outperforms state-of-the-art
    approaches. VisualRepair resolves 196 and 25 instances on the test and dev sets,
    respectively, surpassing the best baseline by 10 and 11 instances. These results
    highlight the effectiveness of type-aware visual understanding and region-focused
    localization for automated visual software issue repair.'
  links:
    arxiv: https://arxiv.org/abs/2607.14075
- short_name: CT-Repair
  title: Multi-Perspective Agentic Program Repair via Code Property Graphs and Temporal
    Execution Graphs
  authors: Zhili Huang, Ling Xu, Hongyu Zhang
  year: '2026'
  venue: arXiv preprint arXiv:2607.12605
  month: 2026-07
  abstract: Large language models (LLMs) have improved automated program repair (APR),
    but two limitations remain. First, raw execution traces are often too large and
    repetitive to serve as effective model context. Second, repeated patch sampling
    may produce different implementations without yielding distinct root-cause hypotheses
    or repair strategies. We present CT-Repair, an agentic APR framework representing
    static and dynamic evidence as queryable Code Property Graph (CPG) and Temporal
    Execution Graph (TEG). CT-Repair applies a three-stage filtering pipeline to construct
    compact TEGs. Three finite-state-machine-guided agents analyze each bug from static,
    dynamic, and hybrid perspectives and independently produce evidence-grounded repair
    strategies. A strategy-guided generation procedure instantiates these strategies
    as candidate patches and uses validation feedback to refine the most promising
    strategy. We evaluate CT-Repair on 854 Java bugs from Defects4J v3.0. In the mixed-model
    configuration, CT-Repair correctly repairs 489 bugs. Under a controlled GPT-5.4-mini
    configuration, it repairs 388 bugs, 19 and 30 more than ReinFix and RepairAgent,
    respectively. The union of the three evidence perspectives repairs 99 more bugs
    than the strongest individual perspective. The filtering pipeline also compacts
    runtime evidence, with execution filtering narrowing the candidate method scope
    by 94.85% on average and behavior filtering further reducing retained runtime
    records by 55.97%. These results show that structured runtime evidence and multi-perspective
    reasoning can improve repair effectiveness without relying solely on a larger
    patch-generation budget.
  links:
    arxiv: https://arxiv.org/abs/2607.12605
- short_name: Retrieval-Oriented Code Representations in Agentic Bug Localization
  title: Retrieval-Oriented Code Representations in Agentic Bug Localization
  authors: Genevieve Caumartin, Tse-Hsun, Chen, Diego Elias Costa
  year: '2026'
  venue: arXiv preprint arXiv:2607.11046
  month: 2026-07
  abstract: 'LLM-based agents are increasingly being used to support software development,
    yet their performance in repository-level tasks depends on retrieving the right
    code context. Existing studies have explored file-level localization using traditional
    information retrieval over file paths and raw source code. However, the role of
    textual code representations in retrieval and localization remains underexplored.
    We study file-level bug localization as a representation-driven retrieval problem.
    Across the Long Code Arena (LCA) and SWE-bench Verified (SWE) datasets, we compare
    five code representations: file paths, raw source code, and three LLM-generated
    textual representations. Our experiments include lexical, semantic, and LLM-based
    retrieval, followed by LLM-based post-retrieval ranking. We quantify the cost
    incurred by a representation through the representation footprint. We find that
    the choice of code representation affects both localization effectiveness and
    cost. Role-aware summaries outperform file-path representations by up to 40% Hit@5
    while requiring a representation footprint 10.4 to 20.9x smaller than raw source
    code. Combining complementary representation results and ranking retrieved candidates
    with an LLM provides further gains of up to 31.9% and 42.0%, respectively. Overall,
    role-aware summaries provide the best cost-effectiveness trade-off, while raw
    source code offers effectiveness in some settings at a significantly higher cost.
    A case study with Agentless reveals the utility of our techniques within a well-known
    pipeline, reaching 94% Hit@6 on file localization (+4.7% against the baseline).
    Our findings suggest that code representation should be treated as a first-class
    design choice in agentic localization pipelines, guided by pipeline stage and
    cost-accuracy requirements.'
  links:
    arxiv: https://arxiv.org/abs/2607.11046
- short_name: ReProAgent
  title: 'ReProAgent: Tool-Augmented Multi-Stage Agentic Generation of Bug Reproduction
    Tests from Issue Reports'
  authors: Quanjun Zhang, Yi Zheng, Ye Shang, Weifeng Sun, Haichuan Hu, Chunrong Fang,
    Zhenyu Chen, Liang Xiao
  year: '2026'
  venue: arXiv preprint arXiv:2607.09123
  month: 2026-07
  abstract: 'Reproduction tests help developers confirm reported issues and provide
    executable feedback for issue resolution, yet issue reports in open-source projects
    rarely include such tests. Recent studies have explored generating issue reproduction
    tests from issue reports with large language models, but existing approaches largely
    rely on prompt-based pipelines that retrieve textual context and generate tests.
    This limits their ability to understand how reported issues behave in repository-scale
    codebases and to flexibly organize the construction of reproduction tests. In
    this paper, we propose ReProAgent, a multi-stage agent framework for reproduction
    test generation from issue reports. ReProAgent decomposes the task into four agent
    stages: bug localization, root cause analysis, test planning, and test generation.
    To support these stages, ReProAgent integrates task-specific tools for task decomposition
    and reflection, context retrieval from both textual sources and repository graphs,
    and runtime interaction with the execution environment. Experiments on SWT-bench-lite
    and SWT-bench-verified show that ReProAgent successfully reproduces 58.43% and
    70.30% of issues, outperforming all baselines, with an average cost of $0.14 per
    instance. For example, when equipped with GPT-5-mini, ReProAgent exceeds OpenHands
    with the same backbone by 20.43 and 7.90 percentage points, respectively. ReProAgent
    also generalizes across multiple backbone LLMs and improves downstream issue resolution
    performance when integrated with existing repair approaches.'
  links:
    arxiv: https://arxiv.org/abs/2607.09123
- short_name: Beyond Textual Repository Exploration
  title: 'Beyond Textual Repository Exploration: Dual-Modal Structural Reasoning for
    Agentic Issue Resolution'
  authors: Jiayi Zhang, Kai Huang, Yang Liu, Chunyang Chen
  year: '2026'
  venue: arXiv preprint arXiv:2607.01929
  month: 2026-07
  abstract: 'Recent advances in agentic program repair have significantly improved
    issue resolution by enabling iterative repository exploration. However, existing
    approaches predominantly rely on sequential, text-based code navigation, which
    fundamentally limits their ability to reason over large-scale long-horizon repositories
    with complex and long-range dependencies. As issue-resolution agents traverse
    repositories through fragmented textual observations, structural information such
    as module organization, call relationships, and dependency chains must be repeatedly
    reconstructed across interaction steps, often leading to exploration drift and
    incomplete localization. We present DUALVIEW, a dual-modal structural scaffolding
    framework that brings visual reasoning into repository exploration for issue-resolution
    agents. DUALVIEW represents repository structure through four complementary graph
    views: Module Coupling Graph (MCG), Function Call Graph (FCG), Class Hierarchy
    Graph (CHG), and Program Dependence Graph (PDG), and exposes them through a queryable
    interface with visual and textual responses. Rather than reconstructing repository
    structure from a sequence of textual observations, agents can directly reason
    over persistent visual representations of code dependencies, enabling more effective
    exploration and understanding of long-horizon codebases. We evaluate DUALVIEW
    on SWE-bench Pro and Verified. Results show that DUALVIEW consistently improves
    issue-resolution performance across different agent architectures and model families.
    Further ablation studies demonstrate that the gains arise not only from textual
    structural information but also from visual externalization of repository dependencies,
    which better supports long-horizon repository exploration.'
  links:
    arxiv: https://arxiv.org/abs/2607.01929
- short_name: ContextSniper
  title: 'ContextSniper: AntTrail''s Token-Efficient Code Memory for Repository-Level
    Program Repair'
  authors: Chiwang Luk, Matin Mohammad Najafi, Zhifeng Jia, Wei Yang, Xiuchang Li,
    Jinwei Zhu, Yang Ren, Lei Chen, Gao Cong
  year: '2026'
  venue: arXiv preprint arXiv:2607.01916
  month: 2026-07
  abstract: Large language model agents can repair real repository issues, but they
    often spend large context budgets on whole-file reads, broad searches, and long
    terminal outputs where useful evidence is mixed with irrelevant code and logs.
    This paper presents ContextSniper, AntTrail's code-repair module for precision
    evidence selection in repository-level program repair, part of AntTrail's broader
    agent-memory engine. AntTrail is available at https://gitcode.com/datagallery/AntTrail.
    ContextSniper indexes code and action memory as three abstract levels, retrieves
    candidates with a hybrid ranker, filters long tool output through an intention-aware
    context gate, and returns compact evidence packets while keeping full source recoverable
    on demand. In a matched 50-task-per-condition comparison on SWE-bench Lite (same
    tasks, baseline vs.\ ContextSniper), ContextSniper reduces total token use by
    51.5% and logged cost by 36.4% for OpenClaw, and by 38.9% and 27.3% for Claude
    Code, with submitted-resolution rates essentially unchanged in both host-agent
    settings. In a separate five-task comparison, ContextSniper beats existing memory-
    and RAG-style integrations on token efficiency. These results suggest ContextSniper
    can substantially cut token and cost overhead for repository-level repair agents
    without a measurable loss in repair quality. The evaluation harness for this study
    is available at https://gitcode.com/lukchiwang/ContextSniper.
  links:
    arxiv: https://arxiv.org/abs/2607.01916
    website: https://gitcode.com/lukchiwang/ContextSniper
- short_name: A Single Patch Is Not Enough
  title: 'A Single Patch Is Not Enough: Deterministic Fusion of Repair Candidates'
  authors: Boyang Yang, Xiangliang Hu, Luyao Ren, Yanjun Chen, Bach Le, Tegawendé
    F. Bissyandé, Haoye Tian
  year: '2026'
  venue: arXiv preprint arXiv:2607.01597
  month: 2026-07
  abstract: 'Modern LLM coding agents are commonly evaluated using pass@k, but developers
    typically apply a single final patch in real-world settings. This pass@k-to-pass@1
    gap is a post-generation problem: a candidate patch pool may contain a correct
    patch, but the system must decide which one to suggest to developers. Existing
    post-generation approaches mainly rank whole candidates, filter them with tests,
    or query an LLM judge, but none deterministically reuse shared edit-atom evidence
    to both select and construct the final patch. Thus, we propose PatchFusion, a
    deterministic atomic evidence fusion approach for candidate patches that consults
    no test outcome at decision time. PatchFusion first fuses whole-diff agreement
    into a repair neighborhood, selects an auditable representative, and then applies
    evidence-constrained fusion (ECF) to retain repeated edit atoms and prune unsupported
    parts. To evaluate this setting, we build PatchFuseBench, a fixed-pool benchmark
    covering SWE-bench Verified, SWE-bench Multilingual, and Defects4J candidate patches.
    On PatchFuseBench, PatchFusion solves 426/500 bugs on SWE-bench Verified and 236/300
    on SWE-bench Multilingual, and reaches 87/371 plausible patches on Defects4J,
    outperforming every matched candidate-pool selector on all three. PatchFusion
    recovers 41 and 27 bugs that no single source solves (30 and 18 more over the
    best single source). Ablation studies show that ECF adds +5/+6/+9 solved bugs
    by recovering in-pool repairs that selection misses, with no observed regression,
    and that PatchFusion''s gains remain stable as candidate pools are resampled.
    On these complementary multi-source pools, cross-candidate evidence recovers more
    correct patches than the test-based and LLM-based selectors we evaluate, at orders-of-magnitude
    lower cost, reaching within 96.2% and 89.7% of the candidate-reachable ceiling
    on the two SWE-bench benchmarks.'
  links:
    arxiv: https://arxiv.org/abs/2607.01597
- short_name: SWE-Doctor
  title: 'SWE-Doctor: Guiding Software Engineering Agents with Runtime Diagnosis from
    Multi-Faceted Bug Reproduction Tests'
  authors: Yaoqi Guo, Yang Liu, Jie M. Zhang, Yun Ma, Yiling Lou, Zhenpeng Chen
  year: '2026'
  venue: arXiv preprint arXiv:2607.00990
  month: 2026-07
  abstract: 'Large language model (LLM)-based software engineering agents are increasingly
    developed to resolve software issues by generating patches from issue reports
    and code repositories. Bug reproduction tests (BRTs) are an important building
    block for such agents and have been shown useful for patch validation. However,
    it remains unclear whether BRTs can also help the more central stage of patch
    generation. We first conduct a preliminary study and find that directly using
    advanced BRT generators to guide patch generation is not beneficial: fail-to-fail
    BRTs can mislead agents, while even fail-to-pass BRTs bring limited or negative
    gains. Our analysis reveals two reasons: fail-to-pass BRTs may cover only one
    manifestation of the reported issue, leading to partial patches, whereas fail-to-fail
    BRTs are unreliable as direct patch-generation targets. Motivated by these insights,
    we propose SWE-Doctor, a software issue resolution agent that guides patch generation
    with runtime diagnoses derived from multi-faceted BRT executions. SWE-Doctor first
    generates multi-faceted BRTs for different behavioral requirements stated in the
    issue, then executes and debugs these BRTs to construct runtime-grounded diagnosis
    records, and finally uses the diagnoses together with localization information
    inferred during BRT generation to guide patch generation and reduce partial patches.
    We evaluate SWE-Doctor on Python bug-fixing issues from the widely adopted SWE-bench
    Verified and SWE-bench Pro across five LLM backends. SWE-Doctor consistently outperforms
    existing agents across all 10 LLM-benchmark combinations, achieving average resolution
    rates of 75.7% on SWE-bench Verified and 59.4% on SWE-bench Pro. In particular,
    on the more challenging SWE-bench Pro, SWE-Doctor improves the average resolution
    rate by 8.0-8.9 percentage points over the baseline agents.'
  links:
    arxiv: https://arxiv.org/abs/2607.00990
- short_name: Loc2Repair
  title: 'Loc2Repair: A Framework for Evaluating the Impact of File-Level Issue Localization
    in Repo-Level LLM Repair'
  authors: Mohammad Nour Al Awad, Sergey Ivanov
  year: '2026'
  venue: arXiv preprint arXiv:2606.30963
  month: 2026-06
  abstract: 'Repository-grounded automated repair is often reported as a single end-to-end
    capability, which hides distinct failure modes such as poor file targeting, incorrect
    patch synthesis, and failed iterative debugging. We present Loc2Repair, a modular
    evaluation framework for controlled analysis of repository-grounded repair pipelines,
    and use it to isolate file-level issue localization as an upstream variable. Loc2Repair
    decouples localization and repair under a shared runtime, artifact schema, and
    evaluation harness, allowing researchers to combine different localization models
    and repair backbones under matched conditions. Using three repair backbones on
    SWE-bench Verified, we compare baseline repair without explicit localization,
    repair guided by predicted localization from two localizers, and repair guided
    by gold modified-file sets. Explicit localization consistently improves resolved
    rate across all backbones: pooled performance increases from 44.7% for baseline
    repair to 48.9% and 49.1% with predicted localization, and to 52.4% with gold
    localization. Localization also reduces mean elapsed time overall: in pooled paired
    analysis, mean elapsed time decreases by 100.94 s and 52.25 s for the two predicted-localization
    settings, and by 154.45 s with gold guidance, although token effects remain heterogeneous
    across models. Overall, Loc2Repair shows file-level localization is a consistent
    repair lever, improving effectiveness and mean latency in pooled analysis, while
    gold-guided failures expose headroom beyond localization.'
  links:
    arxiv: https://arxiv.org/abs/2606.30963
- short_name: PracRepair
  title: 'PracRepair: LLM-Empowered Automated Program Repair Inspired by Human-Like
    Debugging Practices'
  authors: Yu Cheng, Zhongxin Liu, Zhenchang Xing, Chao Ni, Qing Huang, Xiaoxue Ren
  year: '2026'
  venue: arXiv preprint arXiv:2606.17612
  month: 2026-06
  abstract: 'As software systems grow in scale and complexity, debugging and repair
    remain costly and time-consuming. Large language models (LLMs) have advanced automated
    program repair (APR), but existing LLM-based APR approaches still largely rely
    on static or retrieved context, error messages, and coarse-grained validation
    outcomes. As a result, they underutilize dynamic information for failure understanding
    and repair, including failure-execution dynamics and patch-validation dynamics.
    Effectively leveraging such information, however, is challenging: failure-execution
    traces are large and noisy, raw static-dynamic context is not self-explanatory,
    and patch-validation dynamics are often reduced to coarse feedback. To address
    these challenges, we propose \textsc{PracRepair}, a fully automated LLM-based
    APR framework inspired by human-like debugging practices. \textsc{PracRepair}
    constructs an on-demand static-dynamic context from buggy programs and failure
    executions, performs question-driven failure diagnosis to formulate explicit repair
    hypotheses, and iteratively refines candidate patches using validation diagnostics
    and trace-level behavioral changes. Experimental results on Defects4J V1.2 and
    V2.0 show that \textsc{PracRepair} consistently outperforms state-of-the-art baselines.
    Specifically, under GPT-3.5, \textsc{PracRepair} correctly fixes 139/136 bugs
    on Defects4J V1.2/V2.0, while under GPT-4o it further improves to 162/171. Moreover,
    \textsc{PracRepair} generalizes effectively to RWB (Real-World Bugs), achieving
    the best performance across multiple foundation models.'
  links:
    arxiv: https://arxiv.org/abs/2606.17612
- short_name: EviACT
  title: 'EviACT: An Evidence-to-Action Framework for Agentic Program Repair'
  authors: Qianru Meng, Xiao Zhang, Zhaochun Ren, Joost Visser
  year: '2026'
  venue: arXiv preprint arXiv:2605.27238
  month: 2026-05
  abstract: LLM-based agents have moved automated program repair (APR) from fixed-context
    patch generation to interactive repository-level repair. However, existing agentic
    APR systems still struggle to use execution evidence to guide localization, patch
    generation, and validation. We propose EviACT (Evidence-to-Action), an agentic
    APR framework that coordinates three evidence-driven guardrails across repair
    stages. The retrieval scaffold grounds repair context, the compile gate filters
    invalid edits, and the test-driven gate checks target-test recovery before full
    regression. Across four benchmarks, EviACT improves resolve rate over the strongest
    reported comparable baselines by 1.6-6.0 percentage points and shows 70.1-88.6%
    lower reported per-bug API cost where baseline costs are available. Ablations
    and diagnostics suggest that these gains are associated with the coordinated evidence-to-action
    chain, making agentic APR more effective and efficient.
  links:
    arxiv: https://arxiv.org/abs/2605.27238
- short_name: BLAgent
  title: 'BLAgent: Agentic RAG for File-Level Bug Localization'
  authors: Md Afif Al Mamun, Gias Uddin
  year: '2026'
  venue: arXiv preprint arXiv:2605.17965
  month: 2026-05
  abstract: 'Bug localization remains a key bottleneck for large language model (LLM)-based
    software maintenance, where accurately identifying faulty code is essential for
    debugging, root cause analysis, triage, and automated program repair (APR). File-level
    bug localization is especially critical in hierarchical localization and repair
    pipelines, where incorrect file selection can propagate to downstream stages such
    as function-level localization and patch generation. While Retrieval-Augmented
    Generation (RAG) offers a promising way to ground LLMs in repository context,
    existing RAG pipelines often rely on static retrieval and lack the reasoning needed
    to accurately identify faulty code. In this work, we present BLAgent, a novel
    agentic RAG framework for file-level bug localization that integrates three key
    ideas: (i) code structure-aware repository encoding with path-augmented AST-based
    chunking, (ii) dual-perspective query transformation that captures both structural
    and behavioral signals from bug reports, and (iii) two-phase agentic reranking
    that combines symbolic inspection with evidence-grounded reasoning. Unlike prior
    graph-based or multi-hop agentic approaches, BLAgent adopts a bounded reasoning
    strategy that limits LLM-based inspection and reranking to a compact, retrieval-filtered
    set of candidate files, avoiding open-ended repository traversal. This design
    balances localization accuracy with computational cost. On SWE-bench-Lite, BLAgent
    attains over 78% Top-1 accuracy with open-source models and over 86% with a closed-source
    model, while being over 18x cheaper than the strongest baseline using the same
    model. When integrated into an APR framework, BLAgent improves end-to-end repair
    success by up to 25%.'
  links:
    arxiv: https://arxiv.org/abs/2605.17965
- short_name: ContraFix
  title: 'ContraFix: Skill-Enhanced Contrastive Runtime Analysis for Vulnerability
    Repair'
  authors: Simiao Liu, Fang Liu, Peiding Wang, Taichuan Li, Yinghao Zhu, Xiaoli Lian,
    Li Zhang
  year: '2026'
  venue: arXiv preprint arXiv:2605.17450
  month: 2026-05
  abstract: As software systems grow increasingly complex, automated vulnerability
    repair (AVR) remains difficult because the materials available to a repair system
    are usually failure artifacts rather than repair guidance. Traditional analysis
    techniques can provide suspicious locations, reduced triggers, or constraints,
    but they are costly to configure across repositories and seldom directly actionable
    for patch generation. Recent LLM-based agents can edit and validate repository-level
    patches, and experience-based systems can reuse prior repair traces or demonstrations,
    but they still need current-instance evidence that turns a broad, symptom-level
    failure report into a concrete repair decision. We present ContraFix, an agentic
    AVR framework that constructs such evidence through contrastive runtime analysis.
    Starting from a failing witness, ContraFix generates nearby failing and non-failing
    variants, executes them through aligned probe sites, and compares their runtime
    states to infer the repair boundary and guide source-level patching. Each candidate
    patch is accepted only after build and validation. ContraFix also stores validated
    repair episodes in a dual-track skill base, reusing mutation skills to construct
    useful variants and correction skills to refine failed patches. On SEC-Bench,
    ContraFix with GPT-5-mini achieves resolution rate of 92.0% over three repeated
    runs and an average resolution rate of 91.8% +/- 0.8. On PatchEval, it resolves
    73.8% of 225 Go, Python, and JavaScript instances. A semantic audit of benchmark-validated
    SEC-Bench patches shows that 58.2% of ContraFix's patches are semantically correct,
    compared with 31.3% for the strongest baseline, indicating that the proposed framework
    improves semantic correctness beyond benchmark validation.
  links:
    arxiv: https://arxiv.org/abs/2605.17450
    website: https://figshare.com/s/f173c78e44bca88ebaea?file=66112583
- short_name: ARISE
  title: 'ARISE: A Repository-level Graph Representation and Toolset for Agentic Program
    Repair and Fault Localization'
  authors: Shahd Seddik, Fahd Seddik, Amirrezza Esmaeili, Mahdieh Sadatbenis, Fatemeh
    Fard
  year: '2026'
  venue: arXiv preprint arXiv:2605.03117
  month: 2026-05
  abstract: Automated program repair at repository scale requires an agent to locate
    a fault among thousands of files and synthesize a correct patch. Existing graph-based
    agents represent how a repository is organized into files, classes, and functions,
    but they do not model how variable values flow within a procedure, which leaves
    the agent without the semantic precision that function-level and line-level localization
    demand. We present ARISE (Agentic Repository-level Issue Solving Engine), a framework-agnostic
    toolset that builds a multi-granularity program graph, extending structural relationships
    down to statement-level nodes connected by intra-procedural definition-use edges,
    and exposes it through a three-tier tool API that mounts on any tool-use agentic
    framework. The central primitive is data-flow slicing, a queryable agent tool
    that traces in a single call which statements define or consume a variable of
    interest. On SWE-bench Lite (300 real GitHub issues across 11 Python repositories)
    with the open-source Qwen2.5-Coder-32B-Instruct backbone, mounting ARISE on SWE-agent
    as the host resolves 22.0% of issues (66/300), a 4.7 percentage-point gain over
    the unmodified SWE-agent baseline under the identical backbone and host. We show
    this gain is largely attributable to sharper localization, with Function Recall@1
    (R@1) rising from 0.43 to 0.60 (a 40% relative gain) and Line R@1 from 0.26 to
    0.41 (a 58% relative gain). Controlled ablations attribute the improvement to
    the data-flow graph rather than the tool schema, and we further mount the same
    toolset on a second host framework to study its portability. Decoupled from any
    single scaffold, the graph builder and slicing API form a drop-in toolset for
    future repair research.
  links:
    arxiv: https://arxiv.org/abs/2605.03117
    website: https://fard-lab.github.io/ARISE/
