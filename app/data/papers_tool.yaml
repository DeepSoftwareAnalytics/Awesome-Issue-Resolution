- short_name: How Should Agents See Code?
  title: How Should Agents See Code? Rethinking Code Representations for Agentic Software
    Engineering
  authors: Melika Sepidband, Jiho Shin, Song Wang, Hadi Hemmati
  year: '2026'
  venue: arXiv preprint arXiv:2611.07286
  month: 2026-11
  abstract: 'LLM agents are increasingly used for repository-level software engineering
    tasks. However, most agents still access repositories through raw files, lexical
    search, and shell commands, treating code primarily as text. This paper investigates
    map-based code-representation workflows as a design variable in agentic software
    engineering, examining how different repository views change agents'' retrieval
    behavior, task success, token use, and latency. In this paper, we study five code-representation
    workflows: abstract syntax trees, call graphs, module dependencies, documentation-enriched
    search, and a hybrid workflow that combines them. Each workflow exposes a repository
    map that the agent can query during a task. We evaluate Claude Code with Haiku
    4.5 against a raw-tool baseline on four repository-level tasks: fault localization
    with LinuxFLBench, repository-level code generation and repair with SWE-bench
    Pro, test generation with SWT-bench, and security patching with SecBench. The
    results show that representation workflows are most useful as token-saving tools
    when localization is the bottleneck, while their success gains narrow when the
    decisive step is patch or test authoring. On LinuxFLBench, all five workflows
    improve recall@10 over the baseline (0.757-0.829 vs. 0.717) and reduce token usage
    by 25-39%. On SWE-bench Pro, resolution remains close to the baseline (44.3-50.6%
    vs. 49.0%) while token usage drops by 17-26%. On SecBench, Callgraph has the highest
    patch-resolution rate in this sample (34.3% vs. 28.9%) and uses fewer tokens,
    but all workflows increase latency. On SWT-bench, Hybrid and Docs have the highest
    reproducing-test rates in this sample (47.8% and 47.2% vs. 44.7%), but all workflows
    use more tokens and take longer. Overall, map-based workflows change both what
    the agent inspects and how much it spends, but their benefits are task-dependent
    rather than universal.'
  links:
    arxiv: https://arxiv.org/abs/2611.07286
- short_name: Repository-Grounded Rubrics
  title: Repository-Grounded Rubrics for Execution-Free Evaluation of Coding Agents
  authors: Matej Gerek, Danylo Zahorulko, Samuel Budai, Chris Rupley, Thierry Donneau-Golencer
  year: '2026'
  venue: arXiv preprint arXiv:2611.23309
  month: 2026-11
  abstract: Coding agents are usually evaluated by running task-specific tests, but
    tests may be missing or incomplete, and running them requires a working environment
    for each repository. We adapt agentic rubrics, introduced for selecting among
    candidate patches, into an execution-free measure of how far a patch satisfies
    a task's requirements. An agent explores the repository before the change and
    writes weighted binary criteria, and a judge without tools scores a diff by the
    weighted share of criteria it satisfies. We validate the ordering this score produces
    against test outcomes on SWE-bench Verified, using 7,291 labeled patches from
    fifteen systems. Within the 400 tasks that have both resolved and unresolved patches,
    the mean per-task AUROC is 0.826 (0.838 on tasks not used to tune the rubric-generation
    prompt), and ranking systems by their failing patches closely agrees with ranking
    them by resolve rate (Spearman 0.968). Case analyses trace disagreements to tests
    that do not match the task, execution-blocking defects that the textual assessment
    misses, and errors in criteria or verdicts. The validation does not establish
    absolute score magnitudes or requirement satisfaction beyond agreement with tests,
    but rubric scores could complement tests where tests or execution environments
    cannot be assumed.
  links:
    arxiv: https://arxiv.org/abs/2611.23309
- short_name: NINJA
  title: 'NINJA: A Navigator-Inspector Joint Architecture for Context-Efficient Issue
    Localization'
  authors: Wenkai Fang, Shunyu Liu, Wei Luo, Zihao Wu, Yang Zhou, Tongya Zheng, Wotao
    Yin, Jialie Shen, Leszek Rutkowski, Mingli Song, Dacheng Tao
  year: '2026'
  venue: arXiv preprint arXiv:2611.10027
  month: 2026-11
  abstract: 'Recent advances in agent-based methods have demonstrated strong promise
    for issue localization, a critical prerequisite for software issue resolution.
    However, most existing agent-based methods rely on a single agent with a growing
    context, where long-context accumulation compresses the effective reasoning space.
    Meanwhile, the flat exploration structure hinders the balance between file-level
    breadth and function-level depth. To address these limitations, we propose NINJA,
    a hierarchical Navigator-Inspector Joint Architecture for context-efficient issue
    localization. NINJA decomposes repository exploration into global navigation and
    local inspection: the navigator maintains the global search state, performs file-level
    search, and dispatches selected entry files, while inspectors independently conduct
    function-level exploration around the assigned files in separate contexts. Through
    multi-round interactions, inspectors return suspicious locations as feedback,
    and the navigator updates the global state to decide whether to continue exploration
    or finalize localization. This hierarchical design balances file-level breadth
    with function-level depth, while independent inspector contexts prevent local
    exploration traces from accumulating in a single growing context. To further strengthen
    both global coordination and local exploration, we introduce a two-stage agentic
    fine-tuning strategy. Extensive experiments across multiple benchmarks and LLM
    backbones show that NINJA consistently outperforms competitive baselines. Notably,
    after fine-tuning, Qwen3-Coder-30B-A3B-Instruct surpasses the strong closed-source
    Claude-Haiku-4.5 model. Our code is available at https://github.com/wantbook-book/NINJA.'
  links:
    arxiv: https://arxiv.org/abs/2611.10027
    github: https://github.com/wantbook-book/NINJA
- short_name: Repository-Context-Guided Image Understanding
  title: Repository-Context-Guided Image Understanding for Agentic Software Development
  authors: Fumiki Yohena, Toshiaki Sota, Shota Suzuki, Tomoko Okamoto, Michiaki Tatsubori
  year: '2026'
  venue: arXiv preprint arXiv:2611.13026
  month: 2026-11
  abstract: 'Coding agents increasingly receive UI screenshots as part of bug reports,
    yet degraded image quality - caused by low resolution, compression artifacts,
    or small rendered text - can prevent them from identifying the relevant UI elements
    and source files. Vision-language models become less reliable as image quality
    deteriorates, while OCR-assisted approaches may propagate recognition errors from
    degraded inputs. Both approaches are limited when the visual evidence required
    for localization is no longer clearly observable in the query screenshot. We propose
    augmenting coding agents with repository-rendered reference images: crisp screenshots
    generated from the same codebase that the agent is tasked with modifying. These
    references provide readable visual evidence of the application''s UI while preserving
    the current, potentially bug-containing implementation state. Because they are
    generated from the available repository rather than requiring a known bug-free
    version, they can be produced automatically for reproducible application states
    without manual image annotation. We evaluate the approach on a controlled benchmark
    derived from SWE-bench Multimodal by injecting visual UI bugs into a real web
    application. We vary screenshot degradation and reference-image provision and
    measure whether the coding agent identifies the correct source file. The results
    show that reference images improve file localization especially for degraded image
    quality, increasing the gold file match rate under fourfold downsampling with
    JPEG compression. We confirmed with further analysis that the proposed approach
    recognizes text approximately 12 percentage points better than language biased
    OCR under the same degradation.'
  links:
    arxiv: https://arxiv.org/abs/2611.13026
- short_name: ToolPulse
  title: 'Beyond Clumsy Agentic Tool Calling: How Cueing and Spotting Make the Difference'
  authors: Xindi Yang, Yan Liu, Jiajun Sun
  year: '2026'
  venue: arXiv preprint arXiv:2611.19275
  month: 2026-11
  abstract: 'LLM-based task-oriented agents depend on tools to interact with their
    environments, but may overlook execution feedback, repeat ineffective calls, or
    persist with unproductive strategies. These behaviors can hinder agents'' ability
    to use tools autonomously and sustain task progress. We characterize tool-use
    symptoms at two temporal granularities: local clumsy tool-use behaviors and tool-use
    detours spanning multiple interactions. Towards greater autonomy in tool use,
    we present ToolPulse, an online middleware supporting autonomous tool use through
    cueing and spotting. ToolPulse tracks execution state and temporal interaction
    patterns, monitoring proposed calls before dispatch and inspecting execution feedback
    prior to the agent resumes reasoning. It combines state-based rules, semantic
    sequence analysis, and interaction-feature similarity to identify intervention
    opportunities and provide verbal reminders, structured feedback, or context-specific
    advice from auxiliary models. Our process-oriented evaluation distinguishes trigger
    validity, behavioral cessation, and substantive correction alongside task outcomes
    and resource costs. Using SWE-agent with three backbone models, we evaluate 1,350
    trajectories on 90 Python, C++, and Java bug-fix tasks, comparing unassisted execution
    with four assistance strategies. Substantive responses follow 61.6-90.9% of valid
    triggers for tool-use detours. Concise reminders achieve the highest observed
    aggregate substantive-response rate; more elaborate assistance offers symptom-dependent
    benefits and can be less effective. Aggregate repair outcomes remain close to
    baseline, with token savings in selected settings. These findings support proactive
    runtime assistance for autonomous tool use. The gap between behavioral adjustment
    and aggregate repair gains calls for careful decisions on intervention timing
    and assistance strategy in autonomous agents.'
  links:
    arxiv: https://arxiv.org/abs/2611.19275
- short_name: Eliciting and Mitigating Specification Satisficing in Coding Agents
  title: Eliciting and Mitigating Specification Satisficing in Coding Agents
  authors: Ruixin Wang, Tianyi Zhang
  year: '2026'
  venue: arXiv preprint arXiv:2611.16289
  month: 2026-11
  abstract: Coding agents often fail to meet all requirements in the task description.
    In some of these failures, the agent considers an implementation choice that meets
    a requirement, but later decides to commit to another one that does not meet the
    requirement for a reason it finds acceptable. We call this specification satisficing.
    It is challenging to identify and mitigate specification satisficing because the
    agent accepts such choices for its own reasons, and existing self-correction methods
    are biased toward them. We propose SatisFix, which guides a coding agent to report
    these choices and their reasons, and then check each choice against the task description.
    We evaluate SatisFix on DeepSWE and SWE-bench Pro with five LLMs as backbones
    and two different agent frameworks, and compare it with three self-correction
    methods. SatisFix improves the pass@1 of the base agent by an average of 5.09%
    on DeepSWE and 7.06% on the hard subset of SWE-bench Pro. On DeepSWE, it outperforms
    the best baseline by 3.98%. Our ablation study shows that both steps of SatisFix
    contribute to the improvement.
  links:
    arxiv: https://arxiv.org/abs/2611.16289
- short_name: Learn then Bet
  title: 'Learn then Bet: Learning Interpretable Rules for Reliable Agent Intervention'
  authors: You-Lin Chen, Xinyi Lisa Chen, Pedro Herrero-Vidal, Xiaojing Yu, Bingqing
    Song, Bin Xu
  year: '2026'
  venue: arXiv preprint arXiv:2611.17662
  month: 2026-11
  abstract: Autonomous agents now run for hundreds of steps with little or no human
    supervision. In practice, practitioners use runtime monitors such as turn limits
    and keyword filters to decide when a run should be stopped, upgraded, or assisted.
    However, these heuristics may stop runs that would otherwise succeed or allow
    failing runs to continue. To address this limitation, we introduce LeBet (Learn
    then Bet), a statistical learning framework that derives its learning objective
    from sufficient conditions for valid and powerful intervention. In particular,
    LeBet learns an interpretable OR-of-AND monitor and accumulates evidence through
    a fixed betting statistic, intervening when the evidence reaches a prescribed
    threshold. Under finite within-class exchangeability and leave-one-out stability,
    we derive finite-sample guarantees for false-positive control (validity) and detection
    power conditional on the training data, using the same trajectories for learning
    and calibration without assuming independent and identically distributed trajectories.
    To address the intractable combinatorial optimization problem in our learning
    formulation, we use stochastic local search that leverages the monitor's Boolean
    structure to propose rule edits aimed at improving empirical separation. On SWE-bench
    Lite with Ministral 3 8B, the learned monitor saves $34.46\%$ of input-plus-output
    tokens and increases output precision from $18.33\%$ to $21.59\%$. The empirical
    false-positive rate is $13.64\%$. Our results show how to formalize the learning
    problem over interpretable rule sets with statistical conditions and establish
    training-conditional guarantees for reliable intervention based on partial histories.
  links:
    arxiv: https://arxiv.org/abs/2611.17662
- short_name: Adaptive Index Reuse
  title: When Should an Agent Refresh? Adaptive Index Reuse for Efficient Long-Horizon
    Reasoning
  authors: Guangyuan Wang, Yifan Zhang, Shilong Liu
  year: '2026'
  venue: arXiv preprint arXiv:2611.01429
  month: 2026-11
  abstract: Language agents read code, tool output, and dialogue in contexts that
    grow at every step. Dynamic sparse attention lets a small indexer choose the earlier
    tokens each query attends to, but the indexer still scores the whole prefix at
    every layer. Cross-layer reuse methods such as IndexCache rerun the indexer at
    only some layers, with one fixed pattern for every input. In an agent, the relevant
    evidence can change abruptly when a traceback or test result arrives, so fresh
    selections matter more at some steps than at others. We propose Adaptive Index
    Reuse (AIR), which keeps IndexCache's execution and learns, for each segment of
    an agent episode, how many layers refresh their selection. A small controller
    reads signals from completed computation and the latest tool event, chooses a
    pattern from a nested library, and learns from terminal task reward under an expected
    compute budget. On Qwen3-4B-Instruct-2507 with a 128K context, AIR improves success
    over the strongest static schedule at matched cost on SWE-bench Verified (27.0%
    to 32.4%), Terminal-Bench 2.0, and three $τ^2$-bench domains, and it lowers time
    per successful task on all five. Across 50 backbone, context, and benchmark settings,
    it matches or exceeds that schedule in 44.
  links:
    arxiv: https://arxiv.org/abs/2611.01429
- short_name: TraceLite
  title: 'TraceLite: Efficient Trace Reduction for SWE Agents via Optical Compression
    and Redundancy Removal'
  authors: Jingyu Xiao, Qianxi Liu, Yintong Huo, Yuan Jiang, Michael R. Lyu
  year: '2026'
  venue: arXiv preprint arXiv:2610.28612
  month: 2026-10
  abstract: Software engineering agents solve repository-level tasks through iterative
    tool use, but their continuously growing interaction traces incur substantial
    token consumption and inference overhead. Existing compression approaches often
    require model training, auxiliary LLM calls, or assumptions about specific content
    such as source code. We present TraceLite, a simple yet effective, training-free
    framework for compressing heterogeneous SWE-agent observations. Our preliminary
    study shows that optical rendering preserves substantial textual and semantic
    information under moderate compression, while agent trajectories exhibit both
    cross-step and phase-level redundancy. Motivated by these findings, TraceLite
    preserves recent observations as high-fidelity text, renders historical observations
    as compact images, removes overlapping content, and discards phase-expired observation
    payloads after code editing. It requires neither offline training nor auxiliary
    LLM inference. We evaluate TraceLite on SWE-bench Verified and DeepSWE using GPT-5.6-Luna
    and Gemini-3.8Flash as backbone models. On SWE-bench Verified, TraceLite achieves
    78.25% resolve rate, outperforming the evaluated compression baselines while reducing
    average input-token consumption and API cost by 33.05% and 21.30%, respectively.
    Moreover, it introduces only 0.438 seconds of compression latency per observation.
    These results demonstrate that TraceLite improves SWE-agent efficiency with low
    processing overhead and without compromising issue-resolution capability. Our
    code is available at https://github.com/xjywhu/TraceLite.
  links:
    arxiv: https://arxiv.org/abs/2610.28612
    github: https://github.com/xjywhu/TraceLite
- short_name: DeskCheck
  title: Enforcing Code Reasoning in Agentic Scaffold for More Effective Issue Resolution
  authors: Changshu Liu, Ji young Kim, Alireza Ghazanfari, Saanvi Nallu, Reyhaneh
    Jabbarvand
  year: '2026'
  venue: arXiv preprint arXiv:2610.23782
  month: 2026-10
  abstract: 'Reasoning is central to ReAct-based programming agents, yet whether and
    how they reason about code remains unclear. We study 7,955 issue-resolution trajectories
    from six single- and multi-agent scaffolds across four programming languages on
    SWE-bench-Verified, SWE-bench-Pro, and SWE-bench-Lite. We identify 12 forms of
    code reasoning in 66.95% of trajectories. Code reasoning is associated with higher
    resolution rates, and its intensity increases with task complexity. However, it
    remains largely unguided: agents may focus on surface-level symptoms during localization,
    fail to refine near-correct patches, overlook issue requirements, and generate
    tests with limited behavioral diversity. To address these limitations, we propose
    DeskCheck, an agentic scaffold that systematically guides code reasoning throughout
    repository-level issue resolution. DeskCheck simulates execution paths to localize
    root causes, simulates candidate patches to refine near-misses, audits patches
    against issue requirements, and reasons about corner-case inputs and expected
    outputs before generating tests. On 731 SWE-bench-Pro instances, DeskCheck improves
    resolution rates over mini-SWE-Agent and Claude Code by 6.29% to 10.53%, at an
    additional cost of $0.02-$0.28 per instance (average: $0.14). Per-phase analyses
    show higher method-level localization recall, more successful repairs of imprecisely
    localized issues, and better detection of missed corner cases in near-correct
    patches. Exact McNemar tests show statistically significant improvements across
    all subject LLMs (p < 10^-10), while repeated experiments support robustness to
    agent nondeterminism. These findings motivate systematic code reasoning as a means
    of improving programming agents.'
  links:
    arxiv: https://arxiv.org/abs/2610.23782
- short_name: ColGREP
  title: 'Small Agents with Semantic Search: Efficient Multilingual Code Localization'
  authors: Maxence Lasbordes, Aarush Sinha, Raphael Sourty, Amélie Chatelain, Djamé
    Seddah
  year: '2026'
  venue: arXiv preprint arXiv:2610.05099
  month: 2026-10
  abstract: Locating relevant files from natural-language requests is a core subtask
    for agents operating over code repositories. We investigate whether this task
    can be delegated to compact, specialized models to enable on-device search while
    reducing the token usage, latency, and inference cost of larger agents. We show
    that semantic search improves file localization, with gains in accuracy, cross-language
    transfer, and inference efficiency. To study this setting, we introduce a training
    framework for file-localization agents built around ColGREP, a local semantic
    search tool based on late-interaction retrieval models. Our recipe combines weighted
    supervised fine-tuning on teacher trajectories, assigning turn-level credit based
    on retrieval outcomes, with reinforcement learning on localization quality. We
    train three model families with fewer than two billion parameters to formulate
    search queries, inspect retrieved content, and identify relevant files. On localization
    tasks derived from SWE-bench Lite and Multi-SWE-bench Flash, ColGREP-equipped
    agents substantially improve over their base models and outperform corresponding
    GREP-based agents. In addition to improving localization accuracy, ColGREP reduces
    mean end-to-end trajectory latency by 44.1\% on CPU while using 29.1\% fewer tokens,
    and enables better generalization to programming languages unseen during fine-tuning.
    These results suggest that compact, tool-specialized localization agents can provide
    an efficient interface between natural-language requests and large codebases.
  links:
    arxiv: https://arxiv.org/abs/2610.05099
- short_name: CuraLoc
  title: 'CuraLoc: Repository-Level Fault Localization via Planned Code Inspection'
  authors: Sangeeta Warrier, Anush Sankaran, Ryen W. White
  year: '2026'
  venue: arXiv preprint arXiv:2610.31809
  month: 2026-10
  abstract: A bug report describes what went wrong, but rarely where the code should
    change. Existing repository-level localization methods often let language models
    iteratively decide what code to inspect next, requiring repeated model calls and
    substantial token usage. We investigate whether these inspection decisions can
    instead be planned before source retrieval. In this research, we introduce CuraLoc,
    which first selects candidate files and represents their symbols using compact
    behavioral and structural descriptions. In a single planning decision, the model
    jointly selects starting symbols, chooses code relationships to inspect from each,
    and forms hypotheses about likely edits. Deterministic retrieval collects the
    requested source for a final ranking informed by those hypotheses, concentrating
    model reasoning on choosing and comparing code rather than directing each retrieval
    step. We demonstrate the efficacy of our proposed approach on the SWE-Bench Lite
    and Verified datasets. On SWE Bench Verified with GPT-5.2, CuraLoc raises Func@1
    from LocAgent's 53.8% to 59.3% while using 90.3% fewer recorded tokens, and also
    outperforms RepoSearcher (56.2%) and Agentless (39.6%) on Func@1. On SWE-bench
    Lite, CuraLoc achieves a high 83.8% Func@5 accuracy improving on Agentless by
    more than 15% in relative accuracy. Additionally, CuraLoc supports different model
    backbones, with strong localization accuracy demonstrated using both GPT-5.2 and
    GPT-6 Astra. These results provide evidence that repository-level code inspection
    can be planned effectively without iterative model-controlled navigation.
  links:
    arxiv: https://arxiv.org/abs/2610.31809
- short_name: Agentic Interpretation
  title: 'Agentic Interpretation: Harness-Governed Evidence Construction for Software
    Agents'
  authors: Yifeng He, Yanjun Wang, Siwei Cui, Aritra Sengupta, Murali Krishna Ramanathan
  year: '2026'
  venue: arXiv preprint arXiv:2610.23996
  month: 2026-10
  abstract: 'Software agents answer behavioral questions about code, such as whether
    a patch passes tests or which lines caused a failure. These tasks require repository-wide
    evidence, yet most scaffolds leave intermediate findings in free-form trajectories,
    making them hard to reuse and easy to disconnect from final answers. We present
    Agentic Interpretation (AgInt), a framework for harness-governed evidence construction.
    The model proposes typed records, while a deterministic harness admits, grades,
    and persists them, reports unresolved requirements, and licenses answers under
    task-specific rules. The resulting certificate gives the model persistent external
    state and leaves an auditable decision record. Formally, append-only certificate
    states form a grounding lattice ordered by record inclusion, where each admitted
    record extends the state by union. We evaluate AgInt with four models on SWE-bench-Live
    and DeepSWE for patch acceptance and Defects4J and GitBug-Java for fault localization.
    AgInt outperforms the plain agent and Agentic Code Reasoning on all reported patch-acceptance
    metrics and ranks responsible lines higher while inspecting fewer irrelevant lines
    in fault localization. For GLM-5, reject-class F1 rises from 0.256 to 0.543 on
    SWE-bench-Live, All@1 rises from 0.140 to 0.400 on Defects4J, and wasted inspected
    lines fall from 31.5 to 11.7 on GitBug-Java. A matched-template control separates
    the mechanism: the persistent scaffold drives most fault-localization gains, while
    the certificate body and gate govern patch-acceptance calibration. With execution
    licensed, AgInt produces harness-reproduced witnesses for 293 of 475 null-dereference
    candidates versus 253 for a matched shell agent, and 62 of 117 resource-leak candidates
    versus 58. Across reported efficiency measurements, it uses 35% fewer executions
    and reduces cost per candidate by 59%.'
  links:
    arxiv: https://arxiv.org/abs/2610.23996
- short_name: No One-Size-Fits-All
  title: 'No One-Size-Fits-All: Adaptive Code Editing with Feature-Based Strategy
    Selection'
  authors: Jun Wan, Zhongxin Liu, Dajun Chen, Wei Jiang, Yong Li, Xiaoxue Ren
  year: '2026'
  venue: arXiv preprint arXiv:2610.22881
  month: 2026-10
  abstract: 'Large language models have shown strong potential in automating code
    editing (CE) tasks, yet most existing systems rely on a fixed CE strategy (i.e.,
    one-step, search-replace, and plan-apply) across diverse scenarios. In practice,
    CE tasks vary widely in code context, edit locality, and semantic complexity,
    causing no single strategy to perform consistently well. Moreover, systematic
    studies on the relationship between strategies and CE tasks remain scarce, limiting
    further optimization of LLM-based code editing strategies. To address this gap,
    we construct CEBench, comprising 500 real-world CE tasks curated from SWE-bench.
    Then we compare three representative CE strategies (one-step, search-replace,
    plan-apply). Our study reveals two key findings: (1) each strategy exhibits distinct
    advantages for specific CE tasks, with no universal optimality; (2) strategy effectiveness
    is significantly influenced by four core task features: total lines of code, modification
    type, modification scope, and task type. Motivated by these findings, we propose
    Ace, an adaptive code editing framework that dynamically selects optimal CE strategies
    based on task features. Unlike classifier-based or instruction-prompting approaches,
    Ace employs a fine-tuned LLM that learns feature-strategy mappings from empirical
    data to recommend strategies with interpretable rationales. Extensive experiments
    on our CEBench-verified show that Ace outperforms state-of-the-art baselines:
    it boosts Pass@1 by 21.7% while reducing token consumption by 27.3% compared to
    the best baseline (AutoCodeRover). Our strategy selector achieves 72.6% selection
    accuracy with 69.9% rationale accuracy (Cohen''s Kappa = 0.807), providing transparent
    and trustworthy decision-making for developers.'
  links:
    arxiv: https://arxiv.org/abs/2610.22881
- short_name: CQ2-CARE
  title: 'Skip the Compressor: Coding Agents Fix More Issues When They Pick Whole
    Files'
  authors: Xiaocong Yang, Rishit Chatterjee, Himanshu Udupi, Vikram Ramavarapu, ChengXiang
    Zhai
  year: '2026'
  venue: arXiv preprint arXiv:2610.21073
  month: 2026-10
  abstract: 'A coding agent works on repositories that can be far larger than its
    context window can hold. Prompt compressors and retrievers offer solutions to
    this problem, but patching an issue needs two things at once: the files that must
    change, and their code exactly as written, since the model must reproduce the
    lines it edits. Retrievers rank code by its similarity to the issue rather than
    by whether it must change, and compressors delete text to fit the budget. We show
    that at an equal token budget, an agent resolves more issues when the budget goes
    to choosing which files to show verbatim, as our simple selector CQ2-CARE does,
    than when it goes to pruning tokens or retrieving chunks. We fit every context
    to the same per-issue budget on 300 recent SWE-rebench issues and grade each patch
    with the benchmark''s tests. With GPT-5.6 and Claude Opus 5, CQ2-CARE resolves
    43.7% and 46.7% of the issues, 6.3 points more than the best of three compressors
    with either model, and 9.3 and 12.7 points more than the best of three retrievers.
    CQ2-CARE even resolves more issues than two methods trained for issue resolution,
    SweRank (by 0.7 and 1.7 points) and SWE-Pruner (by 2.0 and 7.3). Our analysis
    shows the defects of the baseline methods: retrievers often miss the files to
    edit, and compressors keep them but alter their text, so fewer patches apply.
    Exact-file selection needs no compression model and shows every line as the repository
    has it, so the model can quote the code it edits.'
  links:
    arxiv: https://arxiv.org/abs/2610.21073
- short_name: Cadence
  title: 'Cadence: Strategic Guidance for Coding Agents'
  authors: Minxing Wang, He Ye, Earl T. Barr, Yintong Huo
  year: '2026'
  venue: arXiv preprint arXiv:2610.12269
  month: 2026-10
  abstract: 'Runtime monitors are increasingly used to improve the reliability of
    LLM-based coding agents by inspecting execution trajectories and delivering corrective
    guidance upon detecting misbehavior. However, their effectiveness remains limited
    by static guidance triggering schemes. Existing monitors rely either on fixed
    inspection intervals, missing timely guidance during severe misbehaviors while
    incurring unnecessary overhead during healthy execution, or on rigid heuristic
    rules, failing to detect complex reasoning errors. To address these limitations,
    we propose Cadence, a dynamic monitoring framework that adaptively schedules inspections
    and delivers guidance according to the agent''s real-time execution health. Cadence
    consists of two core modules: a two-tier intervention module and an inspection
    scheduler. The intervention module delivers advisory-level guidance for normal
    executions and minor lapses, while providing replacement-level guidance for severe
    misbehaviors. Driven by the intervention level, the scheduler adjusts the inspection
    frequency by tightening supervision after replacement-level guidance and relaxing
    it after advisory-level guidance. Evaluated on 300 SWE-bench Lite tasks across
    two distinct agents, mini-swe-agent and Moatless, Cadence achieves the highest
    resolve rate among all evaluated monitors. Specifically, Cadence outperforms vanilla
    agents by 25.33\% (+76 resolved tasks) on mini-swe-agent and 15.67\% (+47 resolved
    tasks) on Moatless, while maintaining competitive token efficiency compared to
    state-of-the-art baselines.'
  links:
    arxiv: https://arxiv.org/abs/2610.12269
- short_name: TestGRAD
  title: 'TestGRAD: Evolving Test Suites via Failure Pattern Momentum for SWE-Agent
    Ensemble'
  authors: Pengfei He, Jiayuan Zhou, Shaowei Wang, Ruiqi Pan
  year: '2026'
  venue: arXiv preprint arXiv:2610.10242
  month: 2026-10
  abstract: 'SWE-agent ensembles improve issue resolution by combining candidate patches
    from different agents with complementary strengths. The central problem is therefore
    test-based selection: generate tests, execute candidate patches, and identify
    the best patch. We formulate this process as test-space optimization: evolving
    an executable repository test suite until it distinguishes competing patches.
    Existing test-generation methods are limited optimizers. They usually lack an
    explicit loss for ensemble selection, optimize through incomplete directions that
    mostly create new tests or delete old ones, and perform one-off generation without
    feedback from repeated failures. Inspired by gradient descent with momentum, we
    introduce TestGRAD, a framework for automatic test optimization. TestGRAD centers
    on three concepts. Differential loss gives the optimizer an explicit execution-defined
    target: useful tests should separate candidate patches by behavior. Full CRUD
    gradients expand the update direction from merely creating or deleting tests to
    reading existing test infrastructure, creating new tests, updating stale assertions,
    and deleting only obsolete tests. Failure Pattern Momentum mines frequent failure
    sequences from memory, allowing the optimizer to avoid repeated non-discriminative
    directions while compressing the failure-history context. On SWE-bench Verified,
    TestGRAD achieves 84.2% Pass@1 with a 4-agent ensemble, outperforming the strongest
    baseline (80.6%) by an absolute improvement of 3.6 percentage points, while compressing
    failure-history context by over $100\times$.'
  links:
    arxiv: https://arxiv.org/abs/2610.10242
- short_name: JevCoder
  title: 'JevCoder: When Does Decision Delegation Pay Off in Code Repair?'
  authors: Jiahao Zhang, Yifan Zhang, Yu Huang
  year: '2026'
  venue: arXiv preprint arXiv:2610.19596
  month: 2026-10
  abstract: 'A coding agent repeatedly makes decisions as it repairs code. These decisions
    shape repair trajectories and affect the token cost of successive model requests.
    We ask which repair decisions can be delegated to a low-cost probabilistic judge
    to reduce token use while maintaining repair quality. The judges answer questions
    with probabilities over predefined answers, without generating explanations. We
    evaluate judgment quality across repair stages and test how individual interventions
    change subsequent repair work. We compare these interventions with unguided repair,
    which uses no judge, and with the same workflow using the repair model itself
    as the judge. The benefit depends on the work an intervention changes, rather
    than the cost of the judgment alone. Based on these studies, we propose JevCoder,
    a workflow built around Jev, a low-cost probabilistic judge. It combines code-snippet
    recommendations with action-type guidance and uses judgments to determine when
    to submit. We evaluate three repair models, each on the same 400 tasks: 200 from
    SWE-bench Verified and 200 from SWE-Bench Pro Verified. Compared to unguided repair,
    JevCoder reduces mean repair-model token use by 21.6%-50.6%, with higher observed
    repair rates across all three models.'
  links:
    arxiv: https://arxiv.org/abs/2610.19596
- short_name: OnTrack
  title: 'OnTrack: Real-Time Monitoring and Intervention in LLM Agent Trajectories
    via Streaming Structure-Aware Optimal Transport'
  authors: Babak Barazandeh, Connor Swanson, Chinmay Kulkarni, Nikhil Mungel
  year: '2026'
  venue: arXiv preprint arXiv:2610.12375
  month: 2026-10
  abstract: 'Agents are deployed in applications from trip planners and stock trading
    to IT incident triage. In most cases, LLM agents work autonomously with minimal
    rule-based safeguarding, leading to cost and safety issues from irreversible actions.
    Recent works resolve this either by using a safeguard agent to monitor behavior
    or evaluating logs post-hoc. The first adds cost and latency to every step; the
    second delivers its verdict after the run, when tokens are burned and damage is
    done. To overcome this, we propose OnTrack, a streaming monitoring mechanism that
    compares an agent''s steps and dependencies against recorded successful runs to
    alert users or block the agent in about a millisecond per step. We study this
    problem in three regimes of decreasing access: full reference access (historical
    runs and tool schemas), intermediate access (only tool schemas), and no prior
    knowledge (only step logs as generated). Expectation of OnTrack''s monitoring
    capabilities reduces as data access drops, ranging from plan violation detection
    to identifying loops, stalls, and repeated tool calls. Finally, we evaluate OnTrack
    using SWE-bench trajectories. Based on the first 8 steps, our method ranks failing
    trajectories below succeeding ones better than content similarity approaches (+0.057
    AUROC). With an abort policy, we save about 18% of compute that would be burned
    on failing runs, where 83% of interrupted runs were actually heading to failure
    (5 out of 6 aborts were correct).'
  links:
    arxiv: https://arxiv.org/abs/2610.12375
- short_name: Opera
  title: 'Opera: A Verbal Critic Framework for Long-horizon Coding Agents'
  authors: Kai Mei, Zhiyuan Hu, Yutong Dai, Juntao Tan, Yifan Zhang, Dingjie Song,
    Dimitris N. Metaxas, Silvio Savarese, Ran Xu, Zeyuan Chen
  year: '2026'
  venue: arXiv preprint arXiv:2609.33987
  month: 2026-09
  abstract: 'Long-horizon coding agents need timely corrections, yet feedback can
    be ineffective or even harmful when it misjudges ongoing work or fails to address
    the underlying problem. Existing critics focus on evaluating trajectories and
    generating feedback, but rarely track what happens after feedback is delivered.
    We present Opera, a verbal critic framework that treats each correction as a persistent
    note, followed until the diagnosed problem is resolved. Opera decides when to
    review through periodic and event-driven triggers, diagnoses issues with typed
    operators, audits feedback against visible evidence before delivery, and tracks
    the agent''s subsequent actions to distinguish mere compliance from actual resolution.
    As a test-time critic, Opera improves the resolve rate of non-critic agents by
    up to 12.4, 15.0, and 8.9 percentage points on Terminal-Bench 2.1, a SWE-Bench
    Pro subset, and DeepSWE v1.1, respectively, across four policy models, and achieves
    the highest mean resolve rate among competitive critic baselines on all three
    benchmarks, and also improves policy models when the policy critiques itself.
    Beyond inference, Opera-guided rollouts provide approximately on-policy training
    data: fine-tuning Qwen3.5-9B on them improves its resolve rate on held-out SWE-Bench
    Pro repositories by 10.2 percentage points without a critic at inference time,
    matching fine-tuning on rollouts from a stronger model, while preserving its performance
    when switching harness, i.e., from Openhands to Terminus-2, which the latter substantially
    degrades. Our code is available at: https://github.com/dongyuanjushi/Opera.'
  links:
    arxiv: https://arxiv.org/abs/2609.33987
    github: https://github.com/dongyuanjushi/Opera
- short_name: Semantic Navigation for Issue Localization in Code Repository
  title: Semantic Navigation for Issue Localization in Code Repository
  authors: Yunxiang Wei, Zhenyu Lei, Jundong Li
  year: '2026'
  venue: arXiv preprint arXiv:2609.31176
  month: 2026-09
  abstract: 'Repository-level issue localization aims to identify and rank the files
    and functions relevant to resolving a reported issue. LLM agents approach this
    task iteratively: they identify a set of potentially relevant locations, inspect
    the corresponding code, and revise their judgments about these candidates as new
    evidence is acquired. Existing environments, however, provide limited support
    for this loop: agents must search for unresolved relation targets, reconstruct
    entity semantics from raw source code, and revise candidates without evidential
    basis. To address these limitations, we present SemNav, a framework that leverages
    deterministic retrieval to seed a broad candidate set and an LLM agent to continually
    refine that set, thereby combining initial coverage with evidence-guided revision.
    SemNav supports this process through three key components. A Semantic Navigation
    Graph resolves program relations on demand through a language server, enabling
    direct navigation to related entities across files. Issue-conditioned Semantic
    Cards provide compact, source-grounded interpretations of each entity''s role
    and relevance to the issue. A persistent Candidate Workspace records each candidate
    together with its evidential basis, enabling grounded verification, revision,
    and ranking. Across SWE-bench Lite and PLocBench, SemNav outperforms existing
    baselines, improving File Hit@10 from 68.33\% to 82.67\% with Gemma 4B. Component
    ablations and trajectory analysis support the complementary roles of all three
    components, while Semantic Cards reduce working-context load by 48.2\% relative
    to full-source reading. SemNav further ranks first on all seven evidence-quality
    metrics on SWE-Explore and improves downstream issue resolution from 44.00\% to
    52.33\%.'
  links:
    arxiv: https://arxiv.org/abs/2609.31176
- short_name: TokenCast
  title: 'TokenCast: Forecasting Token Consumption During LLM Agent Execution'
  authors: Chaoqian Ouyang, Ling Yue, Libin Zheng, Hanghui Guo, Shengxiang Xu, YiShu
    Wang, Ran Li, Jian Yin, Shaowu Pan, Shimin Di
  year: '2026'
  venue: arXiv preprint arXiv:2609.35760
  month: 2026-09
  links:
    arxiv: https://arxiv.org/abs/2609.35760
- short_name: Graph-Guided Repository Environment Construction
  title: Graph-Guided Repository Environment Construction
  authors: Jianying Pan, John Zhang, Hongyu Zhang
  year: '2026'
  venue: arXiv preprint arXiv:2609.33429
  month: 2026-09
  links:
    arxiv: https://arxiv.org/abs/2609.33429
- short_name: ENDROC
  title: Evaluating Name-Only Directory Routing for One-Shot Code Search
  authors: Manoj Bajaj
  year: '2026'
  venue: arXiv preprint arXiv:2609.35918
  month: 2026-09
  abstract: Finding the right files is an early challenge for coding agents. We test
    whether a language model can follow directory and file names to find annotated
    code files missed by fixed lexical queries. Across 82 audited issues from 11 repositories
    at pinned pre-fix commits, name-only directory routing recovered 0.465 of gold
    files within eight candidates, compared with 0.352 for FTS5 and 0.245 for a fixed
    full-issue rg query. The paired gain over FTS5 was 0.113 (95% repository-cluster
    bootstrap interval, 0.053 to 0.168). Under a shared 16K-token context budget,
    routing delivered 0.443 of annotated lines versus 0.246 for FTS5 on 55 cases with
    fully aligned annotations. At the same eight-file limit, combining routing with
    FTS5 reached 0.491 file recall, but its gain over routing alone was uncertain.
    An exploratory flat path control reached 0.572 recall while using 24.6 model calls
    per issue, compared with 8.9 for routing. Routing averaged 8.9 seconds per issue;
    FTS5 took 7 milliseconds per query after a 0.9-second build. On this cohort, directory
    routing added relevant file candidates to one-shot lexical search, but the study
    cannot attribute the gain to hierarchy or show that it improves issue resolution.
  links:
    arxiv: https://arxiv.org/abs/2609.35918
- short_name: MM-IssueLoc
  title: 'MM-IssueLoc: A Controlled Benchmark for Evaluating Visual Evidence in Multimodal
    Repository-Level Issue Localization'
  authors: Shaoxiong Zhan, Shi Hu, Boyu Feng, Hai Lin, Andrew Gong, Zhengda Zhou,
    Jiaying Zhou, Yunyun Hou, Hao Su, Hai-Tao Zheng
  year: '2026'
  venue: arXiv preprint arXiv:2607.15205
  month: 2026-07
  abstract: 'Real repository issues routinely include visual evidence such as screenshots,
    error dialogs, rendered UI states, and logs, yet repository-level issue localization
    is evaluated mostly as a text-only task. Existing multimodal SE benchmarks evaluate
    end-to-end repair, entangling localization with patch synthesis and obscuring
    whether visual input helped, hurt, or was ignored. We introduce \textbf{MM-IssueLoc},
    a controlled benchmark and evaluation protocol for repository-level localization
    with visual evidence. MM-IssueLoc contains 652 issue-PR instances across 23 languages,
    with annotations for 7 image categories and 4 relevance levels. It provides file-level
    and function-level gold labels, paired text-only and with-image evaluation, and
    VCE-based diagnostics that convert images into structured textual evidence. We
    evaluate LLM-based and retrieval-based systems, including MM-IssueLoc-VL-Emb as
    a controlled multimodal retriever. Results show that existing systems remain far
    from reliable multimodal repository localization: the strongest agent reaches
    38.96 file Acc@5 and 22.45 function Acc@10, while the strongest retriever reaches
    33.86 function Acc@10. Cross-benchmark comparisons show that high localization
    scores on text-dominant SWE benchmarks do not transfer cleanly to multimodal issue
    localization. MM-IssueLoc turns visual evidence into an explicit evaluation variable,
    enabling future work to test whether systems improve by using visual evidence
    for localization, rather than by relying on text-only cues or downstream patch-generation
    effects.'
  links:
    arxiv: https://arxiv.org/abs/2607.15205
    github: https://github.com/Jasaxion/MM-IssueLoc-Bench
- short_name: LLVM-Bench
  title: 'LLVM-Bench: Benchmarking and Advancing Large Language Models for LLVM Compiler
    Issue Resolution'
  authors: Zhao Tian, Yingquan Zhao, Chenyao Suo, Meng Wang, Junjie Chen
  year: '2026'
  venue: arXiv preprint arXiv:2607.00700
  month: 2026-07
  abstract: LLVM is a widely used compiler infrastructure whose scale and complexity
    make issue resolution labor-intensive and challenging. Although large language
    models (LLMs) have recently achieved remarkable success in issue resolution, their
    effectiveness on complex system-level LLVM compiler remains largely unexplored.
    To address this gap, we introduce LLVM-Bench, the first large-scale benchmark
    for LLVM issue resolution, containing 423 real-world, validated tasks collected
    from the LLVM project. We further develop LLVM-Gym, a scalable evaluation platform
    that automates issue reproduction, patch application, compiler building, and test
    execution. Using LLVM-Bench and LLVM-Gym, we conduct a comprehensive study of
    four representative LLMs, six retrieval configurations, and three agents. Our
    results show that current LLM-based issue resolution techniques remain limited
    on LLVM-Bench, with patch invalidity and build failures as the dominant failure
    modes. We further reveal a strong complementarity among different LLMs and agents,
    motivating LLVM-Ens, a lightweight ensemble approach that expands the patch space
    through integrating the patches generated by diverse techniques, filters incorrect
    and redundant candidates, and identifies the most promising solution. Our results
    show that LLVM-Ens achieves a resolution rate of up to 21.99%, further improving
    LLVM issue resolution.
  links:
    arxiv: https://arxiv.org/abs/2607.00700
- short_name: Know Before Fix
  title: 'Know Before Fix: QA-Driven Repository Knowledge Acquisition for Software
    Issue Resolution'
  authors: Haotian Lin, Silin Chen, Xiaodong Gu, Yuling Shi, Chengxi Pan, Jiaqi Ge,
    Mengfan Li, Jianghong Huang, Mengchieh Chuang, Beijun Shen, Haibing Guan
  year: '2026'
  venue: arXiv preprint arXiv:2607.11111
  month: 2026-07
  abstract: 'LLM-based coding agents have significantly advanced automated software
    issue resolution, yet they remain highly prone to factual errors caused by insufficient
    repository understanding. Recent methods attempt to mitigate this limitation through
    pre-repair repository exploration; however, their fix-driven strategies explore
    repositories without identifying the agent''s knowledge gaps, often yielding imprecise
    context that fails to bridge the underlying understanding deficit. In this paper,
    we propose ACQUIRE, a QA-driven framework for software issue resolution. Mirroring
    how experienced developers first comprehend unfamiliar code before attempting
    a fix, ACQUIRE explicitly acquires repository knowledge prior to repair. The framework
    decouples knowledge acquisition from patch generation through two stages: in the
    first stage, a Questioner and an Answerer collaborate to acquire structured repository
    knowledge, where the Questioner poses targeted questions and the Answerer produces
    evidence-grounded answers through autonomous exploration; in the second stage,
    the Resolver leverages the resulting QA knowledge to generate informed patches.
    By transforming implicit knowledge gaps into explicit, factually reliable understanding,
    ACQUIRE accelerates knowledge-intensive repair stages and enables more accurate
    resolution. Experiments on SWE-bench Verified demonstrate that ACQUIRE consistently
    outperforms representative pre-repair methods, raising Pass@1 by up to 4.4 percentage
    points with modest additional cost and time.'
  links:
    arxiv: https://arxiv.org/abs/2607.11111
- short_name: TrajSpec
  title: Bug Report Specification Refinement with Trajectory Guidance for Automated
    Program Repair
  authors: S M Farah Al Fahim, Md Nakhla Rafi, Md Ahasanuzzaman, Zeyang Ma, Dong Jae
    Kim, Shaowei Wang, Tse-Hsun, Chen
  year: '2026'
  venue: arXiv preprint arXiv:2607.07882
  month: 2026-07
  abstract: Bug reports serve as task specifications for repository-level automated
    program repair (APR) agents, but they often describe only the observed failure
    and omit repair-relevant information such as the failure-inducing behavior, behavioral
    requirement, and implementation scope. As a result, a repair agent may inspect
    irrelevant code, infer an incorrect requirement, or generate a patch that addresses
    the reported symptom without restoring the intended repository behavior. We present
    TrajSpec, a trajectory-guided approach for repository-supported bug report specification
    refinement. Given an original report and a pre-fix repository, TrajSpec runs a
    trajectory-collection agent and uses the resulting unverified trajectory as a
    source of trajectory-derived specification evidence. It organizes this evidence
    into a three-level representation consisting of a high-level interpretation of
    the issue, diagnostic findings supporting that interpretation, and concrete repository
    observations. TrajSpec then generates a draft refined report and applies repository-based
    review to remove unsupported claims, revise uncertain claims, and add repository-supported
    details. We evaluate TrajSpec on all 300 SWE-Bench Lite instances using Mini-SWE-Agent
    V2. TrajSpec's refined reports improve Pass@1 from 41.00% to 59.67% with GPT-5-mini
    and from 54.67% to 64.33% with MiniMax M2.5. On a stratified sample of 100 instances,
    TrajSpec's refined reports also improve Pass@1 from 41.00% to 71.00% with Agentless
    and from 47.00% to 72.00% with AutoCodeRover. Ablation results show that removing
    repository-based review or the hierarchical evidence representation reduces Pass@1
    from 59.67% to 48.00% and 47.67%, respectively. Overall, TrajSpec provides actionable
    repository-supported context that consistently improves repair performance.
  links:
    arxiv: https://arxiv.org/abs/2607.07882
- short_name: PhoenixRepair
  title: 'PhoenixRepair: Rethinking Repair Strategy Exploration in Software Agents'
  authors: Tianyue Jiang, Yanlin Wang, Xin He, Daya Guo, Jiachi Chen, Ming Wen, Ensheng
    Shi, Xilin Liu, Yuchi Ma, Guanbin Li
  year: '2026'
  venue: arXiv preprint arXiv:2607.18859
  month: 2026-07
  abstract: While Large Language Models have greatly advanced automated issue resolution,
    existing agent-based methods exhibit a fundamental limitation in their insufficient
    exploration of repair strategies. This insufficiency manifests in two key aspects.
    First, the exploration of multiple potential edit locations is limited. Second,
    the exploration of repair attempts at each location is also insufficient. To address
    these challenges, we present PhoenixRepair, a multi-agent framework that systematically
    explores multiple candidate edit locations and performs iterative reflection and
    refinement on patch generation, thereby expanding the search space of repair strategies.
    Our framework begins with multi-location sampling, optionally augmented with graph-based
    localization information for difficult tasks, followed by iterative reflection
    and refinement to generate better patches, culminating in final-round generation
    guided by distilled insights from all historical attempts. Experiments on SWE-bench-Verified
    demonstrate that PhoenixRepair achieves the largest relative improvement of 7.8\%
    over SWE-agent under DeepSeek-V3.1, and attains the highest resolved rate of 76.0\%
    Pass@1 under MiniMax-M2.5. Meanwhile, it achieves higher fault localization accuracy
    than existing approaches. Our code is available at https://github.com/DeepSoftwareAnalytics/PhoenixRepair.
  links:
    arxiv: https://arxiv.org/abs/2607.18859
    github: https://github.com/DeepSoftwareAnalytics/PhoenixRepair
- short_name: Beyond Fail-to-Pass
  title: 'Beyond Fail-to-Pass: Iterative Hardening of Co-Generated Bug Reproduction
    Tests and Fixes'
  authors: Yuhao Tan, Zhibang Yang, Fangkai Yang, Yuan Yao, Yu Kang, Lu Wang, Pu Zhao,
    Xin Zhang, Xiaoxing Ma, Qingwei Lin, Saravan Rajmohan, Dongmei Zhang
  year: '2026'
  venue: arXiv preprint arXiv:2607.19843
  month: 2026-07
  abstract: Large language models (LLMs) have made automated program repair (APR)
    increasingly practical for real-world bugs, but repairing directly from bug reports
    remains underconstrained. Bug reproduction tests (BRTs) help close this gap by
    turning a bug report into an executable, bug-specific signal that can guide repair
    and validate candidate patches. Existing work has therefore studied BRT generation
    as a core subproblem in APR and mainly evaluates a generated BRT using the fail-to-pass
    (F->P) criterion, which requires the test to fail on the buggy code but pass on
    the golden fix. We show that F->P alone is insufficient when the goal of a BRT
    is to improve downstream repair. In particular, some F->P BRTs are lax, reproducing
    the observed symptom yet still admitting plausible-but-incorrect patches. We formalize
    this missing quality dimension by separating F->P BRTs into rigorous and lax ones,
    and show empirically that only the former consistently improve repair success.
    We further find that co-generation introduces test--fix error coupling, where
    the in-trajectory fail-to-pass (F->P) check can pass even when both the generated
    patch and generated test are wrong. Based on these findings, we propose CoHarden,
    a co-generation framework that uses the Lax signal as an in-loop convergence criterion.
    CoHarden first generates a test before any fix, then iteratively hardens the test
    and fix against surviving mutation patches until the generated test no longer
    admits Lax regressions. Experiments show that CoHarden reaches 69.4% Resolved
    and 78.9% F->P on SWE-bench Verified, outperforming the strongest fix-only and
    cogeneration baselines by +9.6 and +7.9 percentage points in Resolved, respectively,
    with consistent gains across LLM backbones and benchmarks.
  links:
    arxiv: https://arxiv.org/abs/2607.19843
- short_name: IssueExec
  title: 'IssueExec: A Test-Driven Approach for Localizing Software Engineering Issues'
  authors: Jiawei Liu, Yun Lin, Chenyan Liu, Yu Qian, Yiming Liu, Jiaxin Chang, Weinan
    Zhang, Linpeng Huang
  year: '2026'
  venue: arXiv preprint arXiv:2607.17286
  month: 2026-07
  abstract: 'Issue localization, which identifies code locations requiring modification
    from issue descriptions, is a critical step in automated software maintenance.
    Existing approaches predominantly attempt to directly align issue descriptions
    with code elements, yet often struggle due to the inherent abstraction gap between
    the issue description and code implementation. Seeking alternative signals, our
    theoretical analysis suggests that test suites can serve as executable proxies
    for requirements, reducing localization uncertainty by 7.73 bits of entropy on
    average. A large-scale empirical study on 18 repositories validates this premise:
    existing tests cover 96.98\% of ground-truth files, and the two-hop pathway yields
    stronger semantic connectivity than direct matching in 82.4\% of cases. Despite
    their potential, leveraging tests for localization faces two key challenges: the
    semantic gap separating issue descriptions from test identifiers, and the substantial
    noise in execution traces from infrastructure code. To address these, we propose
    IssueExec, which bridges the semantic gap through domain-knowledge-enhanced test
    representations and filters noise via hierarchical trace analysis. Experiments
    on SWE-bench Lite show that IssueExec achieves state-of-the-art performance, improving
    function-level Recall@1 by 41.57\% over the strongest baseline. When integrated
    into the Agentless pipeline, IssueExec resolves 17.72\% more issues, demonstrating
    practical downstream benefits.'
  links:
    arxiv: https://arxiv.org/abs/2607.17286
- short_name: VisualRepair
  title: 'VisualRepair: Dynamic Tool Calling and Region Focusing for Visual Software
    Issue Repair'
  authors: Jingyu Xiao, Zhongyi Zhang, Haoran Hou, Yuxuan Wan, Yuan Jiang, Yintong
    Huo, Michael R. Lyu
  year: '2026'
  venue: arXiv preprint arXiv:2607.14075
  month: 2026-07
  abstract: 'Automated Program Repair (APR) has witnessed significant progress with
    the advent of Large Language Models (LLMs). However, as modern software systems
    increasingly expose rich graphical user interfaces, effectively leveraging visual
    information from bug screenshots has become essential for understanding bugs and
    generating accurate fixes in multimodal scenarios. Real-world issue reports frequently
    contain heterogeneous visual attachments including UI screenshots, IDE snapshots,
    GIFs, and text-centric images, each with distinct visual patterns and domain-specific
    semantics that impose substantial perceptual demands on MLLMs. Furthermore, bug
    screenshots often contain large expanses of uninformative and bug-irrelevant regions,
    distracting the model''s attention and limiting patch diversity. To address these
    challenges, we propose VisualRepair, an MLLM-based framework for visual software
    issue repair comprising two core modules: Image Type-aware Tool Calling (ITTC),
    which classifies input images and dynamically invokes a tailored tool-calling
    chain for robust visual interpretation, and Dynamic Test-time Region Focusing
    (DTRF), which grounds multiple bug-related region candidates and refines them
    via an adaptive zoom-in and zoom-out strategy to improve fault localization and
    promote diverse patch generation. Extensive experiments on the SWE-bench Multimodal
    benchmark demonstrate that VisualRepair consistently outperforms state-of-the-art
    approaches. VisualRepair resolves 196 and 25 instances on the test and dev sets,
    respectively, surpassing the best baseline by 10 and 11 instances. These results
    highlight the effectiveness of type-aware visual understanding and region-focused
    localization for automated visual software issue repair.'
  links:
    arxiv: https://arxiv.org/abs/2607.14075
- short_name: CT-Repair
  title: Multi-Perspective Agentic Program Repair via Code Property Graphs and Temporal
    Execution Graphs
  authors: Zhili Huang, Ling Xu, Hongyu Zhang
  year: '2026'
  venue: arXiv preprint arXiv:2607.12605
  month: 2026-07
  abstract: Large language models (LLMs) have improved automated program repair (APR),
    but two limitations remain. First, raw execution traces are often too large and
    repetitive to serve as effective model context. Second, repeated patch sampling
    may produce different implementations without yielding distinct root-cause hypotheses
    or repair strategies. We present CT-Repair, an agentic APR framework representing
    static and dynamic evidence as queryable Code Property Graph (CPG) and Temporal
    Execution Graph (TEG). CT-Repair applies a three-stage filtering pipeline to construct
    compact TEGs. Three finite-state-machine-guided agents analyze each bug from static,
    dynamic, and hybrid perspectives and independently produce evidence-grounded repair
    strategies. A strategy-guided generation procedure instantiates these strategies
    as candidate patches and uses validation feedback to refine the most promising
    strategy. We evaluate CT-Repair on 854 Java bugs from Defects4J v3.0. In the mixed-model
    configuration, CT-Repair correctly repairs 489 bugs. Under a controlled GPT-5.4-mini
    configuration, it repairs 388 bugs, 19 and 30 more than ReinFix and RepairAgent,
    respectively. The union of the three evidence perspectives repairs 99 more bugs
    than the strongest individual perspective. The filtering pipeline also compacts
    runtime evidence, with execution filtering narrowing the candidate method scope
    by 94.85% on average and behavior filtering further reducing retained runtime
    records by 55.97%. These results show that structured runtime evidence and multi-perspective
    reasoning can improve repair effectiveness without relying solely on a larger
    patch-generation budget.
  links:
    arxiv: https://arxiv.org/abs/2607.12605
- short_name: Retrieval-Oriented Code Representations in Agentic Bug Localization
  title: Retrieval-Oriented Code Representations in Agentic Bug Localization
  authors: Genevieve Caumartin, Tse-Hsun, Chen, Diego Elias Costa
  year: '2026'
  venue: arXiv preprint arXiv:2607.11046
  month: 2026-07
  abstract: 'LLM-based agents are increasingly being used to support software development,
    yet their performance in repository-level tasks depends on retrieving the right
    code context. Existing studies have explored file-level localization using traditional
    information retrieval over file paths and raw source code. However, the role of
    textual code representations in retrieval and localization remains underexplored.
    We study file-level bug localization as a representation-driven retrieval problem.
    Across the Long Code Arena (LCA) and SWE-bench Verified (SWE) datasets, we compare
    five code representations: file paths, raw source code, and three LLM-generated
    textual representations. Our experiments include lexical, semantic, and LLM-based
    retrieval, followed by LLM-based post-retrieval ranking. We quantify the cost
    incurred by a representation through the representation footprint. We find that
    the choice of code representation affects both localization effectiveness and
    cost. Role-aware summaries outperform file-path representations by up to 40% Hit@5
    while requiring a representation footprint 10.4 to 20.9x smaller than raw source
    code. Combining complementary representation results and ranking retrieved candidates
    with an LLM provides further gains of up to 31.9% and 42.0%, respectively. Overall,
    role-aware summaries provide the best cost-effectiveness trade-off, while raw
    source code offers effectiveness in some settings at a significantly higher cost.
    A case study with Agentless reveals the utility of our techniques within a well-known
    pipeline, reaching 94% Hit@6 on file localization (+4.7% against the baseline).
    Our findings suggest that code representation should be treated as a first-class
    design choice in agentic localization pipelines, guided by pipeline stage and
    cost-accuracy requirements.'
  links:
    arxiv: https://arxiv.org/abs/2607.11046
- short_name: ReProAgent
  title: 'ReProAgent: Tool-Augmented Multi-Stage Agentic Generation of Bug Reproduction
    Tests from Issue Reports'
  authors: Quanjun Zhang, Yi Zheng, Ye Shang, Weifeng Sun, Haichuan Hu, Chunrong Fang,
    Zhenyu Chen, Liang Xiao
  year: '2026'
  venue: arXiv preprint arXiv:2607.09123
  month: 2026-07
  abstract: 'Reproduction tests help developers confirm reported issues and provide
    executable feedback for issue resolution, yet issue reports in open-source projects
    rarely include such tests. Recent studies have explored generating issue reproduction
    tests from issue reports with large language models, but existing approaches largely
    rely on prompt-based pipelines that retrieve textual context and generate tests.
    This limits their ability to understand how reported issues behave in repository-scale
    codebases and to flexibly organize the construction of reproduction tests. In
    this paper, we propose ReProAgent, a multi-stage agent framework for reproduction
    test generation from issue reports. ReProAgent decomposes the task into four agent
    stages: bug localization, root cause analysis, test planning, and test generation.
    To support these stages, ReProAgent integrates task-specific tools for task decomposition
    and reflection, context retrieval from both textual sources and repository graphs,
    and runtime interaction with the execution environment. Experiments on SWT-bench-lite
    and SWT-bench-verified show that ReProAgent successfully reproduces 58.43% and
    70.30% of issues, outperforming all baselines, with an average cost of $0.14 per
    instance. For example, when equipped with GPT-5-mini, ReProAgent exceeds OpenHands
    with the same backbone by 20.43 and 7.90 percentage points, respectively. ReProAgent
    also generalizes across multiple backbone LLMs and improves downstream issue resolution
    performance when integrated with existing repair approaches.'
  links:
    arxiv: https://arxiv.org/abs/2607.09123
- short_name: Beyond Textual Repository Exploration
  title: 'Beyond Textual Repository Exploration: Dual-Modal Structural Reasoning for
    Agentic Issue Resolution'
  authors: Jiayi Zhang, Kai Huang, Yang Liu, Chunyang Chen
  year: '2026'
  venue: arXiv preprint arXiv:2607.01929
  month: 2026-07
  abstract: 'Recent advances in agentic program repair have significantly improved
    issue resolution by enabling iterative repository exploration. However, existing
    approaches predominantly rely on sequential, text-based code navigation, which
    fundamentally limits their ability to reason over large-scale long-horizon repositories
    with complex and long-range dependencies. As issue-resolution agents traverse
    repositories through fragmented textual observations, structural information such
    as module organization, call relationships, and dependency chains must be repeatedly
    reconstructed across interaction steps, often leading to exploration drift and
    incomplete localization. We present DUALVIEW, a dual-modal structural scaffolding
    framework that brings visual reasoning into repository exploration for issue-resolution
    agents. DUALVIEW represents repository structure through four complementary graph
    views: Module Coupling Graph (MCG), Function Call Graph (FCG), Class Hierarchy
    Graph (CHG), and Program Dependence Graph (PDG), and exposes them through a queryable
    interface with visual and textual responses. Rather than reconstructing repository
    structure from a sequence of textual observations, agents can directly reason
    over persistent visual representations of code dependencies, enabling more effective
    exploration and understanding of long-horizon codebases. We evaluate DUALVIEW
    on SWE-bench Pro and Verified. Results show that DUALVIEW consistently improves
    issue-resolution performance across different agent architectures and model families.
    Further ablation studies demonstrate that the gains arise not only from textual
    structural information but also from visual externalization of repository dependencies,
    which better supports long-horizon repository exploration.'
  links:
    arxiv: https://arxiv.org/abs/2607.01929
- short_name: ContextSniper
  title: 'ContextSniper: AntTrail''s Token-Efficient Code Memory for Repository-Level
    Program Repair'
  authors: Chiwang Luk, Matin Mohammad Najafi, Zhifeng Jia, Wei Yang, Xiuchang Li,
    Jinwei Zhu, Yang Ren, Lei Chen, Gao Cong
  year: '2026'
  venue: arXiv preprint arXiv:2607.01916
  month: 2026-07
  abstract: Large language model agents can repair real repository issues, but they
    often spend large context budgets on whole-file reads, broad searches, and long
    terminal outputs where useful evidence is mixed with irrelevant code and logs.
    This paper presents ContextSniper, AntTrail's code-repair module for precision
    evidence selection in repository-level program repair, part of AntTrail's broader
    agent-memory engine. AntTrail is available at https://gitcode.com/datagallery/AntTrail.
    ContextSniper indexes code and action memory as three abstract levels, retrieves
    candidates with a hybrid ranker, filters long tool output through an intention-aware
    context gate, and returns compact evidence packets while keeping full source recoverable
    on demand. In a matched 50-task-per-condition comparison on SWE-bench Lite (same
    tasks, baseline vs.\ ContextSniper), ContextSniper reduces total token use by
    51.5% and logged cost by 36.4% for OpenClaw, and by 38.9% and 27.3% for Claude
    Code, with submitted-resolution rates essentially unchanged in both host-agent
    settings. In a separate five-task comparison, ContextSniper beats existing memory-
    and RAG-style integrations on token efficiency. These results suggest ContextSniper
    can substantially cut token and cost overhead for repository-level repair agents
    without a measurable loss in repair quality. The evaluation harness for this study
    is available at https://gitcode.com/lukchiwang/ContextSniper.
  links:
    arxiv: https://arxiv.org/abs/2607.01916
    website: https://gitcode.com/lukchiwang/ContextSniper
- short_name: A Single Patch Is Not Enough
  title: 'A Single Patch Is Not Enough: Deterministic Fusion of Repair Candidates'
  authors: Boyang Yang, Xiangliang Hu, Luyao Ren, Yanjun Chen, Bach Le, Tegawendé
    F. Bissyandé, Haoye Tian
  year: '2026'
  venue: arXiv preprint arXiv:2607.01597
  month: 2026-07
  abstract: 'Modern LLM coding agents are commonly evaluated using pass@k, but developers
    typically apply a single final patch in real-world settings. This pass@k-to-pass@1
    gap is a post-generation problem: a candidate patch pool may contain a correct
    patch, but the system must decide which one to suggest to developers. Existing
    post-generation approaches mainly rank whole candidates, filter them with tests,
    or query an LLM judge, but none deterministically reuse shared edit-atom evidence
    to both select and construct the final patch. Thus, we propose PatchFusion, a
    deterministic atomic evidence fusion approach for candidate patches that consults
    no test outcome at decision time. PatchFusion first fuses whole-diff agreement
    into a repair neighborhood, selects an auditable representative, and then applies
    evidence-constrained fusion (ECF) to retain repeated edit atoms and prune unsupported
    parts. To evaluate this setting, we build PatchFuseBench, a fixed-pool benchmark
    covering SWE-bench Verified, SWE-bench Multilingual, and Defects4J candidate patches.
    On PatchFuseBench, PatchFusion solves 426/500 bugs on SWE-bench Verified and 236/300
    on SWE-bench Multilingual, and reaches 87/371 plausible patches on Defects4J,
    outperforming every matched candidate-pool selector on all three. PatchFusion
    recovers 41 and 27 bugs that no single source solves (30 and 18 more over the
    best single source). Ablation studies show that ECF adds +5/+6/+9 solved bugs
    by recovering in-pool repairs that selection misses, with no observed regression,
    and that PatchFusion''s gains remain stable as candidate pools are resampled.
    On these complementary multi-source pools, cross-candidate evidence recovers more
    correct patches than the test-based and LLM-based selectors we evaluate, at orders-of-magnitude
    lower cost, reaching within 96.2% and 89.7% of the candidate-reachable ceiling
    on the two SWE-bench benchmarks.'
  links:
    arxiv: https://arxiv.org/abs/2607.01597
- short_name: SWE-Doctor
  title: 'SWE-Doctor: Guiding Software Engineering Agents with Runtime Diagnosis from
    Multi-Faceted Bug Reproduction Tests'
  authors: Yaoqi Guo, Yang Liu, Jie M. Zhang, Yun Ma, Yiling Lou, Zhenpeng Chen
  year: '2026'
  venue: arXiv preprint arXiv:2607.00990
  month: 2026-07
  abstract: 'Large language model (LLM)-based software engineering agents are increasingly
    developed to resolve software issues by generating patches from issue reports
    and code repositories. Bug reproduction tests (BRTs) are an important building
    block for such agents and have been shown useful for patch validation. However,
    it remains unclear whether BRTs can also help the more central stage of patch
    generation. We first conduct a preliminary study and find that directly using
    advanced BRT generators to guide patch generation is not beneficial: fail-to-fail
    BRTs can mislead agents, while even fail-to-pass BRTs bring limited or negative
    gains. Our analysis reveals two reasons: fail-to-pass BRTs may cover only one
    manifestation of the reported issue, leading to partial patches, whereas fail-to-fail
    BRTs are unreliable as direct patch-generation targets. Motivated by these insights,
    we propose SWE-Doctor, a software issue resolution agent that guides patch generation
    with runtime diagnoses derived from multi-faceted BRT executions. SWE-Doctor first
    generates multi-faceted BRTs for different behavioral requirements stated in the
    issue, then executes and debugs these BRTs to construct runtime-grounded diagnosis
    records, and finally uses the diagnoses together with localization information
    inferred during BRT generation to guide patch generation and reduce partial patches.
    We evaluate SWE-Doctor on Python bug-fixing issues from the widely adopted SWE-bench
    Verified and SWE-bench Pro across five LLM backends. SWE-Doctor consistently outperforms
    existing agents across all 10 LLM-benchmark combinations, achieving average resolution
    rates of 75.7% on SWE-bench Verified and 59.4% on SWE-bench Pro. In particular,
    on the more challenging SWE-bench Pro, SWE-Doctor improves the average resolution
    rate by 8.0-8.9 percentage points over the baseline agents.'
  links:
    arxiv: https://arxiv.org/abs/2607.00990
- short_name: Loc2Repair
  title: 'Loc2Repair: A Framework for Evaluating the Impact of File-Level Issue Localization
    in Repo-Level LLM Repair'
  authors: Mohammad Nour Al Awad, Sergey Ivanov
  year: '2026'
  venue: arXiv preprint arXiv:2606.30963
  month: 2026-06
  abstract: 'Repository-grounded automated repair is often reported as a single end-to-end
    capability, which hides distinct failure modes such as poor file targeting, incorrect
    patch synthesis, and failed iterative debugging. We present Loc2Repair, a modular
    evaluation framework for controlled analysis of repository-grounded repair pipelines,
    and use it to isolate file-level issue localization as an upstream variable. Loc2Repair
    decouples localization and repair under a shared runtime, artifact schema, and
    evaluation harness, allowing researchers to combine different localization models
    and repair backbones under matched conditions. Using three repair backbones on
    SWE-bench Verified, we compare baseline repair without explicit localization,
    repair guided by predicted localization from two localizers, and repair guided
    by gold modified-file sets. Explicit localization consistently improves resolved
    rate across all backbones: pooled performance increases from 44.7% for baseline
    repair to 48.9% and 49.1% with predicted localization, and to 52.4% with gold
    localization. Localization also reduces mean elapsed time overall: in pooled paired
    analysis, mean elapsed time decreases by 100.94 s and 52.25 s for the two predicted-localization
    settings, and by 154.45 s with gold guidance, although token effects remain heterogeneous
    across models. Overall, Loc2Repair shows file-level localization is a consistent
    repair lever, improving effectiveness and mean latency in pooled analysis, while
    gold-guided failures expose headroom beyond localization.'
  links:
    arxiv: https://arxiv.org/abs/2606.30963
- short_name: PracRepair
  title: 'PracRepair: LLM-Empowered Automated Program Repair Inspired by Human-Like
    Debugging Practices'
  authors: Yu Cheng, Zhongxin Liu, Zhenchang Xing, Chao Ni, Qing Huang, Xiaoxue Ren
  year: '2026'
  venue: arXiv preprint arXiv:2606.17612
  month: 2026-06
  abstract: 'As software systems grow in scale and complexity, debugging and repair
    remain costly and time-consuming. Large language models (LLMs) have advanced automated
    program repair (APR), but existing LLM-based APR approaches still largely rely
    on static or retrieved context, error messages, and coarse-grained validation
    outcomes. As a result, they underutilize dynamic information for failure understanding
    and repair, including failure-execution dynamics and patch-validation dynamics.
    Effectively leveraging such information, however, is challenging: failure-execution
    traces are large and noisy, raw static-dynamic context is not self-explanatory,
    and patch-validation dynamics are often reduced to coarse feedback. To address
    these challenges, we propose \textsc{PracRepair}, a fully automated LLM-based
    APR framework inspired by human-like debugging practices. \textsc{PracRepair}
    constructs an on-demand static-dynamic context from buggy programs and failure
    executions, performs question-driven failure diagnosis to formulate explicit repair
    hypotheses, and iteratively refines candidate patches using validation diagnostics
    and trace-level behavioral changes. Experimental results on Defects4J V1.2 and
    V2.0 show that \textsc{PracRepair} consistently outperforms state-of-the-art baselines.
    Specifically, under GPT-3.5, \textsc{PracRepair} correctly fixes 139/136 bugs
    on Defects4J V1.2/V2.0, while under GPT-4o it further improves to 162/171. Moreover,
    \textsc{PracRepair} generalizes effectively to RWB (Real-World Bugs), achieving
    the best performance across multiple foundation models.'
  links:
    arxiv: https://arxiv.org/abs/2606.17612
- short_name: EviACT
  title: 'EviACT: An Evidence-to-Action Framework for Agentic Program Repair'
  authors: Qianru Meng, Xiao Zhang, Zhaochun Ren, Joost Visser
  year: '2026'
  venue: arXiv preprint arXiv:2605.27238
  month: 2026-05
  abstract: LLM-based agents have moved automated program repair (APR) from fixed-context
    patch generation to interactive repository-level repair. However, existing agentic
    APR systems still struggle to use execution evidence to guide localization, patch
    generation, and validation. We propose EviACT (Evidence-to-Action), an agentic
    APR framework that coordinates three evidence-driven guardrails across repair
    stages. The retrieval scaffold grounds repair context, the compile gate filters
    invalid edits, and the test-driven gate checks target-test recovery before full
    regression. Across four benchmarks, EviACT improves resolve rate over the strongest
    reported comparable baselines by 1.6-6.0 percentage points and shows 70.1-88.6%
    lower reported per-bug API cost where baseline costs are available. Ablations
    and diagnostics suggest that these gains are associated with the coordinated evidence-to-action
    chain, making agentic APR more effective and efficient.
  links:
    arxiv: https://arxiv.org/abs/2605.27238
- short_name: BLAgent
  title: 'BLAgent: Agentic RAG for File-Level Bug Localization'
  authors: Md Afif Al Mamun, Gias Uddin
  year: '2026'
  venue: arXiv preprint arXiv:2605.17965
  month: 2026-05
  abstract: 'Bug localization remains a key bottleneck for large language model (LLM)-based
    software maintenance, where accurately identifying faulty code is essential for
    debugging, root cause analysis, triage, and automated program repair (APR). File-level
    bug localization is especially critical in hierarchical localization and repair
    pipelines, where incorrect file selection can propagate to downstream stages such
    as function-level localization and patch generation. While Retrieval-Augmented
    Generation (RAG) offers a promising way to ground LLMs in repository context,
    existing RAG pipelines often rely on static retrieval and lack the reasoning needed
    to accurately identify faulty code. In this work, we present BLAgent, a novel
    agentic RAG framework for file-level bug localization that integrates three key
    ideas: (i) code structure-aware repository encoding with path-augmented AST-based
    chunking, (ii) dual-perspective query transformation that captures both structural
    and behavioral signals from bug reports, and (iii) two-phase agentic reranking
    that combines symbolic inspection with evidence-grounded reasoning. Unlike prior
    graph-based or multi-hop agentic approaches, BLAgent adopts a bounded reasoning
    strategy that limits LLM-based inspection and reranking to a compact, retrieval-filtered
    set of candidate files, avoiding open-ended repository traversal. This design
    balances localization accuracy with computational cost. On SWE-bench-Lite, BLAgent
    attains over 78% Top-1 accuracy with open-source models and over 86% with a closed-source
    model, while being over 18x cheaper than the strongest baseline using the same
    model. When integrated into an APR framework, BLAgent improves end-to-end repair
    success by up to 25%.'
  links:
    arxiv: https://arxiv.org/abs/2605.17965
- short_name: ContraFix
  title: 'ContraFix: Skill-Enhanced Contrastive Runtime Analysis for Vulnerability
    Repair'
  authors: Simiao Liu, Fang Liu, Peiding Wang, Taichuan Li, Yinghao Zhu, Xiaoli Lian,
    Li Zhang
  year: '2026'
  venue: arXiv preprint arXiv:2605.17450
  month: 2026-05
  abstract: As software systems grow increasingly complex, automated vulnerability
    repair (AVR) remains difficult because the materials available to a repair system
    are usually failure artifacts rather than repair guidance. Traditional analysis
    techniques can provide suspicious locations, reduced triggers, or constraints,
    but they are costly to configure across repositories and seldom directly actionable
    for patch generation. Recent LLM-based agents can edit and validate repository-level
    patches, and experience-based systems can reuse prior repair traces or demonstrations,
    but they still need current-instance evidence that turns a broad, symptom-level
    failure report into a concrete repair decision. We present ContraFix, an agentic
    AVR framework that constructs such evidence through contrastive runtime analysis.
    Starting from a failing witness, ContraFix generates nearby failing and non-failing
    variants, executes them through aligned probe sites, and compares their runtime
    states to infer the repair boundary and guide source-level patching. Each candidate
    patch is accepted only after build and validation. ContraFix also stores validated
    repair episodes in a dual-track skill base, reusing mutation skills to construct
    useful variants and correction skills to refine failed patches. On SEC-Bench,
    ContraFix with GPT-5-mini achieves resolution rate of 92.0% over three repeated
    runs and an average resolution rate of 91.8% +/- 0.8. On PatchEval, it resolves
    73.8% of 225 Go, Python, and JavaScript instances. A semantic audit of benchmark-validated
    SEC-Bench patches shows that 58.2% of ContraFix's patches are semantically correct,
    compared with 31.3% for the strongest baseline, indicating that the proposed framework
    improves semantic correctness beyond benchmark validation.
  links:
    arxiv: https://arxiv.org/abs/2605.17450
    website: https://figshare.com/s/f173c78e44bca88ebaea?file=66112583
- short_name: ARISE
  title: 'ARISE: A Repository-level Graph Representation and Toolset for Agentic Program
    Repair and Fault Localization'
  authors: Shahd Seddik, Fahd Seddik, Amirrezza Esmaeili, Mahdieh Sadatbenis, Fatemeh
    Fard
  year: '2026'
  venue: arXiv preprint arXiv:2605.03117
  month: 2026-05
  abstract: Automated program repair at repository scale requires an agent to locate
    a fault among thousands of files and synthesize a correct patch. Existing graph-based
    agents represent how a repository is organized into files, classes, and functions,
    but they do not model how variable values flow within a procedure, which leaves
    the agent without the semantic precision that function-level and line-level localization
    demand. We present ARISE (Agentic Repository-level Issue Solving Engine), a framework-agnostic
    toolset that builds a multi-granularity program graph, extending structural relationships
    down to statement-level nodes connected by intra-procedural definition-use edges,
    and exposes it through a three-tier tool API that mounts on any tool-use agentic
    framework. The central primitive is data-flow slicing, a queryable agent tool
    that traces in a single call which statements define or consume a variable of
    interest. On SWE-bench Lite (300 real GitHub issues across 11 Python repositories)
    with the open-source Qwen2.5-Coder-32B-Instruct backbone, mounting ARISE on SWE-agent
    as the host resolves 22.0% of issues (66/300), a 4.7 percentage-point gain over
    the unmodified SWE-agent baseline under the identical backbone and host. We show
    this gain is largely attributable to sharper localization, with Function Recall@1
    (R@1) rising from 0.43 to 0.60 (a 40% relative gain) and Line R@1 from 0.26 to
    0.41 (a 58% relative gain). Controlled ablations attribute the improvement to
    the data-flow graph rather than the tool schema, and we further mount the same
    toolset on a second host framework to study its portability. Decoupled from any
    single scaffold, the graph builder and slicing API form a drop-in toolset for
    future repair research.
  links:
    arxiv: https://arxiv.org/abs/2605.03117
    website: https://fard-lab.github.io/ARISE/
- short_name: AgentForge
  title: 'AgentForge: Execution-Grounded Multi-Agent LLM Framework for Autonomous
    Software Engineering'
  authors: Rajesh Kumar, Waqar Ali, Junaid Ahmed, Najma Imtiaz Ali, Shaban Usman
  year: '2026'
  venue: arXiv preprint arXiv:2604.13120
  month: 2026-04
