- short_name: Steer, Don't Solve
  title: 'Steer, Don''t Solve: Training Small Critic Models for Large Code Agents'
  authors: Shubham Gandhi, Yiqing Xie, Atharva Naik, Ruichen Zhu, Carolyn Rose
  year: '2026'
  venue: arXiv preprint arXiv:2606.21811
  month: 2026-06
  abstract: This work trains separate 4B and 8B critic models to guide larger coding
    agents during inference. The critics periodically review agent trajectories, identify
    mistakes, and provide high-level planning advice without producing concrete actions.
    Training uses supervised fine-tuning followed by direct preference optimization.
    Experiments on SWE-bench Verified report improvements across six coding agents
    and lower inference costs for some agents through shorter solution trajectories.
