- short_name: SWEzze
  title: Compressing Code Context for LLM-based Issue Resolution
  authors: Haoxiang Jia, Earl T. Barr, Sergey Mechtaev
  year: '2026'
  venue: arXiv preprint arXiv:2603.28119
  month: 2026-03
  abstract: 'Large Language Models (LLMs) are now capable of resolving real-world
    GitHub issues. However, current approaches overapproximate the code context and
    suffer from two compounding problems: the prohibitive cost of processing massive
    inputs, and low effectiveness as noise floods the context window and distracts
    the model from the bug-fixing signal. Existing compression techniques fail to
    resolve this tension: generic compressors compromise the semantic integrity of
    code, while code-specific tools lack awareness of code structure and task context
    to preserve essential patch ingredients. To address this, we propose a novel framework
    consisting of two components. First, Oracle-guided Code Distillation (OCD), a
    context distillation algorithm that combines genetic search and delta debugging
    to systematically reduce code contexts to their minimal sufficient subsequence
    - retaining only the ingredients required for a successful fix. We use this distilled
    data to fine-tune SWEzze, a lightweight model that learns to compress code context
    at inference time, filtering noise and combating distraction while preserving
    fix ingredients. Evaluated on SWE-bench Verified across three frontier LLMs, SWEzze
    maintains a stable compression rate of about 6 times across models, reduces the
    total token budget by 51.8%-71.3% relative to the uncompressed setting, improves
    issue resolution rates by 5.0%-9.2%, and delivers the best overall balance among
    effectiveness, compression ratio, and latency compared with state-of-the-art context
    compression baselines.'
  links:
    arxiv: https://arxiv.org/abs/2603.28119
