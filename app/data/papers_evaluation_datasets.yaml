- short_name: ComBench
  title: 'ComBench: A Repo-level Real-world Benchmark for Compilation Error Repair'
  authors: Jia Li, Zeyang Zhuang, Zhuangbin Chen, Yuxin Su, Wei Meng, Michael R. Lyu
  year: '2026'
  venue: arXiv preprint arXiv:2603.27333
  month: 2026-03
  abstract: Compilation errors pose pervasive and critical challenges in software
    development, significantly hindering productivity. Therefore, Automated Compilation
    Error Repair (ACER) techniques are proposed to mitigate these issues. Despite
    recent advancements in ACER, its real-world performance remains poorly evaluated.
    This can be largely attributed to the limitations of existing benchmarks, \ie
    decontextualized single-file data, lack of authentic source diversity, and biased
    local task modeling that ignores crucial repository-level complexities. To bridge
    this critical gap, we propose ComBench, the first repository-level, reproducible
    real-world benchmark for C/C++ compilation error repair. ComBench is constructed
    through a novel, automated framework that systematically mines real-world failures
    from the GitHub CI histories of large-scale open-source projects. Our framework
    contributes techniques for the high-precision identification of ground-truth repair
    patches from complex version histories and a high-fidelity mechanism for reproducing
    the original, ephemeral build environments. To ensure data quality, all samples
    in ComBench are execution-verified -- guaranteeing reproducible failures and build
    success with ground-truth patches. Using ComBench, we conduct a comprehensive
    evaluation of 12 modern LLMs under both direct and agent-based repair settings.
    Our experiments reveal a significant gap between a model's ability to achieve
    syntactic correctness (a 73% success rate for GPT-5) and its ability to ensure
    semantic correctness (only 41% of its patches are valid). We also find that different
    models exhibit distinct specializations for different error types. ComBench provides
    a robust and realistic platform to guide the future development of ACER techniques
    capable of addressing the complexities of modern software development.
  links:
    arxiv: https://arxiv.org/abs/2603.27333
