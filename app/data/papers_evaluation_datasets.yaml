- short_name: Active-SWE
  title: 'Active-SWE: Benchmarking Coding Agents for Proactive Bug Fixing without
    Issue Reports'
  authors: Haobin Li, Ping Deng, Weizhong Qian, Liang Jiang, Zhenyu Huang, Mouxing
    Yang, Xi Peng
  year: '2026'
  venue: arXiv preprint arXiv:2608.04682
  month: 2026-08
  abstract: Coding agents powered by large language models (LLMs) are increasingly
    adopted in software engineering (SWE) scenarios, capable of fixing a specific
    bug in large-scale codebase. However, existing SWE benchmarks typically assume
    that high-quality issue reports with detailed information are always available,
    which is easily violated in practice due to the complexity of report acquisition
    and curation. To address this, we introduce Active-SWE, a benchmark for evaluating
    coding agents on proactively discovering and fixing multiple bugs without report
    guidance, covering 1,663 tasks across six bug categories and eight languages.
    Beyond shifting the focus from existing reactive bug fixing to proactive bug fixing,
    Active-SWE enables a more in-depth evaluation by expanding the scope from fixing
    a specific recorded bug to multiple-bug fixing and potential bug discovery scenarios.
    To construct Active-SWE, we propose a novel difficulty-aware task formulation
    pipeline with a dual-track evaluation framework, facilitating comprehensive evaluation
    of proactive bug-fixing capability. Extensive experiments reveal that most state-of-the-art
    coding agents struggle with proactive bug-fixing tasks, demonstrating limited
    performance in locating and resolving recorded bugs, handling multiple bug fixing
    scenarios, and discovering valid potential bugs.
  links:
    arxiv: https://arxiv.org/abs/2608.04682
    github: https://github.com/XLearning-SCU/Active-SWE
    huggingface: https://github.com/XLearning-SCU/Active-SWE
- short_name: MM-IssueLoc
  title: 'MM-IssueLoc: A Controlled Benchmark for Evaluating Visual Evidence in Multimodal
    Repository-Level Issue Localization'
  authors: Shaoxiong Zhan, Shi Hu, Boyu Feng, Hai Lin, Andrew Gong, Zhengda Zhou,
    Jiaying Zhou, Yunyun Hou, Hao Su, Hai-Tao Zheng
  year: '2026'
  venue: arXiv preprint arXiv:2607.15205
  month: 2026-07
  abstract: 'Real repository issues routinely include visual evidence such as screenshots,
    error dialogs, rendered UI states, and logs, yet repository-level issue localization
    is evaluated mostly as a text-only task. Existing multimodal SE benchmarks evaluate
    end-to-end repair, entangling localization with patch synthesis and obscuring
    whether visual input helped, hurt, or was ignored. We introduce \textbf{MM-IssueLoc},
    a controlled benchmark and evaluation protocol for repository-level localization
    with visual evidence. MM-IssueLoc contains 652 issue-PR instances across 23 languages,
    with annotations for 7 image categories and 4 relevance levels. It provides file-level
    and function-level gold labels, paired text-only and with-image evaluation, and
    VCE-based diagnostics that convert images into structured textual evidence. We
    evaluate LLM-based and retrieval-based systems, including MM-IssueLoc-VL-Emb as
    a controlled multimodal retriever. Results show that existing systems remain far
    from reliable multimodal repository localization: the strongest agent reaches
    38.96 file Acc@5 and 22.45 function Acc@10, while the strongest retriever reaches
    33.86 function Acc@10. Cross-benchmark comparisons show that high localization
    scores on text-dominant SWE benchmarks do not transfer cleanly to multimodal issue
    localization. MM-IssueLoc turns visual evidence into an explicit evaluation variable,
    enabling future work to test whether systems improve by using visual evidence
    for localization, rather than by relying on text-only cues or downstream patch-generation
    effects.'
  links:
    arxiv: https://arxiv.org/abs/2607.15205
    github: https://github.com/Jasaxion/MM-IssueLoc-Bench
- short_name: SWE-Review
  title: 'SWE-Review: Closing the Loop on Issue Resolution with Agentic Code Review'
  authors: Ruoyu Wang, Jierun Chen, Shaowei Wang, Chaofan Tao, Sidi Yang, Yuxin Jiang,
    Kim-Hui Yap, Lifeng Shang, Xiaohui Li, Haoli Bai
  year: '2026'
  venue: arXiv preprint arXiv:2607.06065
  month: 2026-07
  abstract: 'Coding agents increasingly generate pull requests (PRs) for real-world
    software issues, yet one-shot PR generation remains open-loop: the PR is proposed
    without systematic review, diagnosis, or revision. We introduce \textbf{SWE-Review},
    a framework for closing this loop with agentic code review. Given an issue and
    an AI-generated PR, a reviewer agent explores the repository, decides whether
    the PR should be accepted, and provides structured feedback for revision. We evaluate
    this setting with our proposed \textbf{SWE-Review-Bench} to measure both review
    correctness and downstream revision usefulness. We further curate \textbf{SWE-Review-Traj}
    dataset to study broader applications of agentic review and fill the data-scarcity
    gap for open reviewer training. Experiments show that agentic review continuously
    improves PRs through a generate-review-revise loop, outperforms single-turn fixed-context
    review in both decision accuracy and resolve rate after revision, transfers beyond
    review to improve issue-resolution models, and enables effective and efficient
    test-time scaling. These results position agentic code review as a practical mechanism
    for moving AI coding agents from one-shot PR generation toward closed-loop issue
    resolution.'
  links:
    arxiv: https://arxiv.org/abs/2607.06065
    github: https://github.com/SWE-Lego/SWE-Review
    huggingface: https://huggingface.co/collections/SWE-Lego/swe-review
- short_name: LLVM-Bench
  title: 'LLVM-Bench: Benchmarking and Advancing Large Language Models for LLVM Compiler
    Issue Resolution'
  authors: Zhao Tian, Yingquan Zhao, Chenyao Suo, Meng Wang, Junjie Chen
  year: '2026'
  venue: arXiv preprint arXiv:2607.00700
  month: 2026-07
  abstract: LLVM is a widely used compiler infrastructure whose scale and complexity
    make issue resolution labor-intensive and challenging. Although large language
    models (LLMs) have recently achieved remarkable success in issue resolution, their
    effectiveness on complex system-level LLVM compiler remains largely unexplored.
    To address this gap, we introduce LLVM-Bench, the first large-scale benchmark
    for LLVM issue resolution, containing 423 real-world, validated tasks collected
    from the LLVM project. We further develop LLVM-Gym, a scalable evaluation platform
    that automates issue reproduction, patch application, compiler building, and test
    execution. Using LLVM-Bench and LLVM-Gym, we conduct a comprehensive study of
    four representative LLMs, six retrieval configurations, and three agents. Our
    results show that current LLM-based issue resolution techniques remain limited
    on LLVM-Bench, with patch invalidity and build failures as the dominant failure
    modes. We further reveal a strong complementarity among different LLMs and agents,
    motivating LLVM-Ens, a lightweight ensemble approach that expands the patch space
    through integrating the patches generated by diverse techniques, filters incorrect
    and redundant candidates, and identifies the most promising solution. Our results
    show that LLVM-Ens achieves a resolution rate of up to 21.99%, further improving
    LLVM issue resolution.
  links:
    arxiv: https://arxiv.org/abs/2607.00700
- short_name: A11YRepair
  title: 'A11YRepair: Bridging Web Accessibility Barriers via Knowledge-Enhanced Divide-and-Conquer
    Repair'
  authors: Kai Huang, Ling Zhu, Jian Zhang, Xiaofei Xie, Chunyang Chen
  year: '2026'
  venue: arXiv preprint arXiv:2606.21926
  month: 2026-06
  abstract: Web accessibility (A11Y), which ensures web content is perceivable and
    usable for users with disabilities, is a critical requirement for modern web applications.
    Yet existing tooling overwhelmingly focuses on detecting A11Y violations rather
    than repairing them. Automated program repair (APR) techniques appear promising
    for this setting, but our study shows that state-of-the-art APR systems perform
    poorly when applied to real-world A11Y violations. Unlike conventional sparse-bug
    scenarios, web A11Y issues often manifest as multiple structurally related violations
    per page, requiring coordinated edits across multiple files. Existing repair systems
    fail to manage this multi-fault scale, as they handle each bug individually without
    considering their relationships or incorporating domain rules such as the Web
    Content Accessibility Guidelines (WCAG). We propose A11YRepair, an LLM-based framework
    for web A11Y repair. A11YRepair introduces a divide-and-conquer workflow that
    first clusters violations requiring coordinated edits to reduce redundant localization,
    and then decomposes each cluster by root cause so the LLM can generate focused
    and consistent patches. The framework further incorporates WCAG-driven knowledge
    to strengthen domain awareness during both fault localization and patch synthesis.
    To support systematic evaluation, we construct A11YBench, a benchmark of 60 real-world
    web projects collected from GitHub. Experimental results show that A11YRepair
    achieves higher repair effectiveness and lower cost than state-of-the-art baselines,
    and ablation studies confirm the importance of its divide-and-conquer design and
    selective domain knowledge integration. Specifically, patches generated by A11YRepair
    have been merged into open-source projects from Google, Microsoft, Facebook, IBM,
    K8s, Docker, and Alibaba, demonstrating its practical value.
  links:
    arxiv: https://arxiv.org/abs/2606.21926
- short_name: MPC-Patch-Bench
  title: 'MPC-Patch-Bench: Security-Aware LLM Code Patch for Multi-Party Computation'
  authors: Yukuan Zhang, Mengxin Zheng, Qian Lou
  year: '2026'
  venue: arXiv preprint arXiv:2606.11416
  month: 2026-06
  abstract: 'Repository-level benchmarks for evaluating Large Language Model (LLM)
    code repair on Secure Multi-Party Computation (MPC) software do not yet exist,
    and directly transplanting general-purpose benchmarks such as SWE-bench fails
    on three structural fronts: (i) MPC repositories are dominated by generic Python
    infrastructure rather than cryptographic logic; (ii) high-value MPC fixes lack
    the standardized tests rigid extraction pipelines require; and (iii) standard
    fail-to-pass evaluation is insufficient for code that must also be cryptographically
    safe. MPC is increasingly deployed for privacy-preserving machine learning, biomedical
    collaboration, and secure analytics. Existing MPC-specific code-synthesis efforts
    cover only operator-level or single-framework tasks; evaluating LLM agents on
    real repository-level MPC repair instead demands MPC-aware data curation and a
    verifier matched to the security and numerical-fidelity guarantees MPC programs
    must obey neither of which existing benchmarks provide. We introduce MPC-Patch-Bench,
    a repository-level benchmark organised around two frameworks. (1)The Data Curation
    Framework combines a domain-specific curation agent that filters raw pull requests
    through three cryptographic layers with a human-AI completion engine that synthesizes
    missing problem statements and Fail-to-Pass/Pass-to-Pass tests, yielding 205 fully
    verified instances. (2)The MPC Verifier provides dedicated security and numerical-fidelity
    checks via dynamic differential testing against plaintext oracles and MPC-specific
    static analysis rules that flag unsafe reveals, insecure arithmetic, and illegal
    public/private casts. The strongest evaluated LLM functionally resolves only 22.9%
    of MPC-Patch-Bench tasks; the MPC Verifier further reduces verified resolution
    to 17.1%, with up to 40% of functionally-passing patches rejected for cryptographic
    or numerical-fidelity violations.'
  links:
    arxiv: https://arxiv.org/abs/2606.11416
