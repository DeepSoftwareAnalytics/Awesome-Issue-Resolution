- short_name: SWE-Cycle
  title: 'SWE-Cycle: Benchmarking Code Agents across the Complete Issue Resolution
    Cycle'
  authors: Hao Guan, Lingyue Fu, Shao Zhang, Yaoming Zhu, Kangning Zhang, Lin Qiu,
    Xunliang Cai, Xuezhi Cao, Weiwen Liu, Weinan Zhang, Yong Yu
  year: '2026'
  venue: arXiv preprint arXiv:2605.13139
  month: 2026-05
  abstract: As autonomous code agents move toward end-to-end software development,
    evaluating their practical autonomy becomes critical. Current benchmarks hide
    friction by testing agents in pre-configured environments, and their static evaluation
    pipelines frequently fail when parsing fully autonomous trajectories. We address
    these limitations with SWE-Cycle, a benchmark of 489 rigorously filtered instances.
    SWE-Cycle evaluates agents across three isolated tasks, including environment
    reconstruction, code implementation, and verification test generation, as well
    as an end-to-end FullCycle task that integrates all three. The FullCycle task
    requires agents to work autonomously in a bare repository without human scaffolding.
    To reliably assess these complex execution paths, we developed SWE-Judge. By combining
    static code review with dynamic testing, this execution-capable evaluation agent
    accurately verifies functional correctness and eliminates the systematic measurement
    errors of traditional static parsers. We evaluate code agents powered by six state-of-the-art
    LLMs across these four tasks. The results reveal a sharp drop in solve rates when
    transitioning from isolated tasks to FullCycle execution, exposing critical bottlenecks
    in handling cross-phase dependencies and maintaining code quality. Together, SWE-Cycle
    and SWE-Judge provide a comprehensive framework for accurately measuring the end-to-end
    capabilities of autonomous software agents.
  links:
    arxiv: https://arxiv.org/abs/2605.13139
- short_name: SmellBench
  title: 'SmellBench: Evaluating LLM Agents on Architectural Code Smell Repair'
  authors: Ion George Dinu, Marian Cristian Mihăescu, Traian Rebedea
  year: '2026'
  venue: arXiv preprint arXiv:2605.07001
  month: 2026-05
  abstract: 'Architectural code smells erode software maintainability and are costly
    to repair manually, yet unlike localized bugs, they require cross-module reasoning
    about design intent that challenges both developers and automated tools. While
    large language model agents excel at bug fixing and code-level refactoring, their
    ability to repair architectural code smells remains unexplored. We present the
    first empirical evaluation of LLM agents on architectural code smell repair. We
    contribute SmellBench, a task orchestration framework that incorporates smell-type-specific
    optimized prompts and supports iterative multi-step execution, together with a
    scoring methodology that separately evaluates repair effectiveness, false positive
    identification, and net codebase impact. We evaluate 11 agent configurations from
    four model families (GPT, Claude, Gemini, Mistral) on 65 hard-severity architectural
    smells detected by PyExamine in the Python project scikit-learn, validated against
    expert judgments. Expert validation reveals that 63.1% of detected smells are
    false positives, while the best agent achieves a 47.7% resolution rate. Agents
    identify false positives with up to $κ= 0.94$ expert agreement, but repair aggressiveness
    and net codebase quality are inversely related: the most aggressive agent introduces
    140 new smells. These findings expose a gap between current LLM capabilities in
    localized code transformations and the architectural understanding needed for
    cross-module refactoring. SmellBench provides reusable infrastructure for tracking
    progress on this underexplored dimension of automated software engineering. We
    release our code and data at https://doi.org/10.5281/zenodo.19247588.'
  links:
    arxiv: https://arxiv.org/abs/2605.07001
    website: https://zenodo.org/records/19247588
