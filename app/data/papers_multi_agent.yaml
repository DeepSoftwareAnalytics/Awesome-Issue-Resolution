- short_name: iSWE Agent
  title: Resolving Java Code Repository Issues with iSWE Agent
  authors: Jatin Ganhotra, Sami Serhan, Antonio Abu Nassar, Avraham Shinnar, Ziv Nevo,
    Martin Hirzel
  year: '2026'
  venue: arXiv preprint arXiv:2603.11356
  month: 2026-03
  abstract: Resolving issues on code repositories is an important part of software
    engineering. Various recent systems automatically resolve issues using large language
    models and agents, often with impressive performance. Unfortunately, most of these
    models and agents focus primarily on Python, and their performance on other programming
    languages is lower. In particular, a lot of enterprise software is written in
    Java, yet automated issue resolution for Java is under-explored. This paper introduces
    iSWE Agent, an automated issue resolver with an emphasis on Java. It consists
    of two sub-agents, one for localization and the other for editing. Both have access
    to novel tools based on rule-based Java static analysis and transformation. Using
    this approach, iSWE achieves state-of-the-art issue resolution rates across the
    Java splits of both Multi-SWE-bench and SWE-PolyBench. More generally, we hope
    that by combining the best of rule-based and model-based techniques, this paper
    contributes towards improving enterprise software development.
  links:
    arxiv: https://arxiv.org/abs/2603.11356
