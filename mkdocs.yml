site_name: Awesome Issue Resolution
site_description: Advances and Frontiers of LLM-based Issue Resolution in Software Engineering A Comprehensive Survey
site_url: https://DeepSoftwareAnalytics.github.io/Awesome-Issue-Resolution/

repo_name: DeepSoftwareAnalytics/Awesome-Issue-Resolution
repo_url: https://github.com/DeepSoftwareAnalytics/Awesome-Issue-Resolution

theme:
  name: material
  custom_dir: app/docs/overrides
  palette:
    - scheme: default
      primary: blue
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.tabs
    - navigation.tabs.sticky
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.integrate
    - navigation.indexes
    - navigation.expand
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/custom.css

# Include PDF files in build output
docs_dir: app/docs
site_dir: app/site

# Validation settings - suppress warnings for internal directory links
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: ignore

# Exclude files from site build
exclude_docs: |
  images/README.md
  **/README.md

# Copy admin HTML and generated JSON as-is (not processed as markdown)
hooks: []

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 4
      title: On this page
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.extra

nav:
  - Home: index.md
  - Paper: paper.md
  - Tables & Resources: tables.md
  - Admin: admin/index.md
  - About: about.md
  - Cite: cite.md
